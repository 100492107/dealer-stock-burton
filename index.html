function updateDashStrip() {
  const ON = ['Stock','Demonstrators','Pre-reg','Commercials','Arriving Soon','New'];
  // In stock = still on site (matches Pentagon live after sync)
  const onSite = (vehicles || []).filter(v => ON.includes(v.category || 'Stock'));
  // Reserved = website reserved flag OR salesperson ownership on the desk
  const reserved = onSite.filter(v =>
    (v.status_flags || []).includes('Reserved') ||
    !!(v.reserved_by || '').trim()
  );
  // Sold in last 7 days (from our sold_date when it left the website)
  const weekAgo = Date.now() - 7 * 86400000;
  const sold7 = (vehicles || []).filter(v => {
    const cat = v.category || '';
    if (cat !== 'Sold' && cat !== 'Delivered') return false;
    const raw = v.sold_date || v.updatedAt || '';
    if (!raw) return true; // count recent unknowns as in-window if sold
    const t = new Date(raw).getTime();
    if (isNaN(t)) return true;
    return t >= weekAgo;
  });
  // Ageing: days since first tracked on this system (bring_into_stock_date)
  const over60 = onSite.filter(v => {
    const n = daysInStock(v);
    return n != null && n >= 60;
  });
  const set = (id, n) => { const el = document.getElementById(id); if (el) el.textContent = String(n); };
  set('dashInStock', onSite.length);
  set('dashReserved', reserved.length);
  set('dashSold7', sold7.length);
  set('dashOver60', over60.length);
}

function exportCsv() {
  const rows = vehicles.slice().sort((a,b) => (a.make||'').localeCompare(b.make||'') || (a.model||'').localeCompare(b.model||''));
  const cols = ['registration','make','model','derivative','model_year','mileage','fuel','transmission','colour','retail_price','previous_price','dealer_peg','prep_status','reserved_by','reserved_at','sold_by','sold_date','category','service_history','bring_into_stock_date','days_in_stock'];
  const esc = (x) => {
    const s = x == null ? '' : String(x);
    if (/[",\\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const lines = [cols.join(',')];
  rows.forEach(v => {
    const days = daysInStock(v);
    const line = cols.map(c => {
      if (c === 'days_in_stock') return esc(days);
      return esc(v[c]);
    }).join(',');
    lines.push(line);
  });
  const blob = new Blob([lines.join('\\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dealer-stock-burton-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}


async function sharedSave(payload) {
  try {
    const res = await fetch('/api/save-override', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      console.warn('Shared save failed', data);
      return { ok: false, error: data.error || res.statusText };
    }
    return { ok: true, data };
  } catch (e) {
    console.warn(e);
    return { ok: false, error: String(e) };
  }
}

async function loadFromVehiclesJson() {
  if (!location.protocol.startsWith('http')) return false;
  try {
    setSyncStatus('Loading…', '');
    const res = await fetch('./vehicles.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const list = await res.json();
    if (!Array.isArray(list) || !list.length) throw new Error('Empty');
    // Keep manual team data across stock refresh (notes / service history are NOT on the website)
    const prevByReg = {};
    (vehicles || []).forEach(v => {
      if (v && v.registration) prevByReg[v.registration] = v;
    });
    let imgMap = {};
    try {
      const ir = await fetch('./images_map.json?t=' + Date.now(), { cache: 'no-store' });
      if (ir.ok) imgMap = await ir.json();
    } catch (_) {}
    let overrides = {};
    try {
      let or = await fetch('/api/save-override?t=' + Date.now(), { cache: 'no-store' }).catch(() => null);
      if (or && or.ok) overrides = await or.json();
      else {
        or = await fetch('./overrides.json?t=' + Date.now(), { cache: 'no-store' });
        if (or.ok) overrides = await or.json();
      }
    } catch (_) {}
    vehicles = list.map(v => {
      const prev = prevByReg[v.registration] || {};
      const o = overrides[v.registration] || overrides[v.id] || {};
      // Priority: shared overrides → previous session → scraped stock (usually empty for these fields)
      v.notes = (o.notes != null ? o.notes : null) ?? (prev.notes || []) ;
      v.service_history = (o.service_history != null ? o.service_history : null) ?? (prev.service_history || '');
      v.service_history_notes = (o.service_history_notes != null ? o.service_history_notes : null) ?? (prev.service_history_notes || '');
      v.status_flags = (o.status_flags != null ? o.status_flags : null) ?? (prev.status_flags || []);
      v.special_offer = (o.special_offer != null ? o.special_offer : null) ?? (prev.special_offer || v.special_offer || '');
      // Category: Sold/Delivered etc from overrides or previous, else scraped
      if (o.category) v.category = o.category;
      else if (prev.category && prev.category !== 'Stock' && v.category === 'Stock') {
        // keep manual categories only if scrape still says Stock and we had something else
        // (Sold is set by server sync when car leaves website)
      }
      if (prev.bring_into_stock_date && !v.bring_into_stock_date) v.bring_into_stock_date = prev.bring_into_stock_date;
      if (!v.image_url && imgMap[v.registration]) v.image_url = imgMap[v.registration];
      return v;
    });
    localStorage.setItem('dealerStock', JSON.stringify(vehicles));
    localStorage.setItem('dealerStockVersion', IMPORT_VERSION);
    setSyncStatus(vehicles.length + ' cars · synced ' + new Date().toLocaleString('en-GB', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}), 'ok');
    return true;
  } catch (e) {
    console.warn(e);
    return false;
  }
}


// Live team sync: pull shared notes/edits often; full stock less often
const AUTO_OVERRIDES_MS = 20000;
const AUTO_STOCK_MS = 180000;
let autoRefreshTimer = null;

function applyOverridesToVehicles(overrides) {
  if (!overrides || typeof overrides !== 'object') return false;
  let changed = false;
  vehicles.forEach(v => {
    const o = overrides[v.registration] || overrides[v.id];
    if (!o) return;
    if (o.notes != null && JSON.stringify(o.notes) !== JSON.stringify(v.notes || [])) {
      v.notes = o.notes; changed = true;
    }
    if (o.service_history != null && o.service_history !== v.service_history) {
      v.service_history = o.service_history; changed = true;
    }
    if (o.service_history_notes != null && o.service_history_notes !== v.service_history_notes) {
      v.service_history_notes = o.service_history_notes; changed = true;
    }
    if (o.dealer_peg != null && String(o.dealer_peg) !== String(v.dealer_peg || '')) {
      v.dealer_peg = o.dealer_peg; changed = true;
    }
    if (o.peg_number != null && !v.dealer_peg) {
      v.dealer_peg = o.peg_number; changed = true;
    }
    if (o.prep_status != null && o.prep_status !== v.prep_status) {
      v.prep_status = o.prep_status; changed = true;
    }
    if (o.reserved_by != null && o.reserved_by !== v.reserved_by) {
      v.reserved_by = o.reserved_by; changed = true;
    }
    if (o.reserved_at != null && o.reserved_at !== v.reserved_at) {
      v.reserved_at = o.reserved_at; changed = true;
    }
    if (o.sold_by != null && o.sold_by !== v.sold_by) {
      v.sold_by = o.sold_by; changed = true;
    }
    if (o.sold_date != null && o.sold_date !== v.sold_date) {
      v.sold_date = o.sold_date; changed = true;
    }
    if (o.category != null && o.category !== v.category) {
      v.category = o.category; changed = true;
    }
    if (o.status_flags != null && JSON.stringify(o.status_flags) !== JSON.stringify(v.status_flags || [])) {
      v.status_flags = o.status_flags; changed = true;
    }
    if (o.special_offer != null && o.special_offer !== v.special_offer) {
      v.special_offer = o.special_offer; changed = true;
    }
    if (o.category && o.category !== v.category) {
      v.category = o.category; changed = true;
    }
  });
  if (changed) {
    save();
    if (currentId) {
      const still = vehicles.find(x => x.id === currentId);
      if (still) openDetail(currentId);
    }
    renderList();
  }
  return changed;
}

async function pollOverrides() {
  if (!location.protocol.startsWith('http')) return;
  try {
    // Prefer API (reads GitHub live — no Vercel CDN wait)
    let overrides = null;
    try {
      const res = await fetch('/api/save-override?t=' + Date.now(), { cache: 'no-store' });
      if (res.ok) overrides = await res.json();
    } catch (_) {}
    if (!overrides) {
      const res = await fetch('./overrides.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      overrides = await res.json();
    }
    applyOverridesToVehicles(overrides);
  } catch (_) {}
}

async function pollStockQuiet() {
  if (!location.protocol.startsWith('http')) return;
  try {
    const res = await fetch('./vehicles.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const list = await res.json();
    if (!Array.isArray(list) || !list.length) return;
    // Preserve manual fields from current state / will re-merge overrides after
    const prevByReg = {};
    vehicles.forEach(v => { if (v.registration) prevByReg[v.registration] = v; });
    let overrides = {};
    try {
      let or = await fetch('/api/save-override?t=' + Date.now(), { cache: 'no-store' }).catch(() => null);
      if (or && or.ok) overrides = await or.json();
      else {
        or = await fetch('./overrides.json?t=' + Date.now(), { cache: 'no-store' });
        if (or.ok) overrides = await or.json();
      }
    } catch (_) {}
    const oldRegs = new Set(vehicles.map(v => v.registration));
    const newRegs = new Set(list.map(v => v.registration));
    const changed = oldRegs.size !== newRegs.size || [...newRegs].some(r => !oldRegs.has(r));
    vehicles = list.map(v => {
      const prev = prevByReg[v.registration] || {};
      const o = overrides[v.registration] || overrides[v.id] || {};
      v.notes = (o.notes != null ? o.notes : null) ?? (prev.notes || []);
      v.service_history = (o.service_history != null ? o.service_history : null) ?? (prev.service_history || '');
      v.service_history_notes = (o.service_history_notes != null ? o.service_history_notes : null) ?? (prev.service_history_notes || '');
      v.status_flags = (o.status_flags != null ? o.status_flags : null) ?? (prev.status_flags || []);
      v.special_offer = (o.special_offer != null ? o.special_offer : null) ?? (prev.special_offer || v.special_offer || '');
      v.dealer_peg = (o.dealer_peg != null ? o.dealer_peg : null) ?? (prev.dealer_peg || v.dealer_peg || '');
      v.prep_status = (o.prep_status != null ? o.prep_status : null) ?? (prev.prep_status || v.prep_status || '');
      v.reserved_by = (o.reserved_by != null ? o.reserved_by : null) ?? (prev.reserved_by || v.reserved_by || '');
      v.reserved_at = (o.reserved_at != null ? o.reserved_at : null) ?? (prev.reserved_at || v.reserved_at || '');
      v.sold_by = (o.sold_by != null ? o.sold_by : null) ?? (prev.sold_by || v.sold_by || '');
      if (v.previous_price == null && prev.previous_price != null) v.previous_price = prev.previous_price;
      if (o.sold_date) v.sold_date = o.sold_date;
      else if (prev.sold_date) v.sold_date = prev.sold_date;
      if (o.category) v.category = o.category;
      else if (prev.category && prev.category !== 'Stock') v.category = prev.category;
      if (prev.bring_into_stock_date) v.bring_into_stock_date = prev.bring_into_stock_date;
      return v;
    });
    save();
    if (changed) {
      setSyncStatus(vehicles.length + ' cars · auto-updated ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}), 'ok');
      renderList();
    }
  } catch (_) {}
}

function startAutoRefresh() {
  if (autoRefreshTimer) return;
  setInterval(pollOverrides, AUTO_OVERRIDES_MS);
  setInterval(pollStockQuiet, AUTO_STOCK_MS);
  // first overrides poll after short delay
  setTimeout(pollOverrides, 8000);
}

(async function init() {
  if (await loadFromVehiclesJson()) { startAutoRefresh(); startReliableSync(); renderList(); try { updateDashStrip(); } catch(_){} return; }
  if (!vehicles.length) vehicles = IMPORTED_STOCK;
  setSyncStatus(vehicles.length ? vehicles.length + ' cars · local' : 'No data', '');
  updateImagesToggleBtn();
  startAutoRefresh();
  startReliableSync();
  renderList();
})();
