<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dealer Stock Manager · Burton</title>
<style>
:root {
  --bg: #f4f6f9;
  --bg-soft: #eef1f6;
  --card: #ffffff;
  --border: #d8dee8;
  --text: #1a2332;
  --muted: #6b7a90;
  --primary: #1a56a8;
  --primary-h: #154785;
  --primary-dim: #e8f0fb;
  --accent: #0d9488;
  --danger: #dc2626;
  --success: #16a34a;
  --nav: #1a2332;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.45; min-height: 100vh; }

.top-nav { background: var(--nav); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 0 1rem; height: 52px; position: sticky; top: 0; z-index: 50; }
.brand { font-weight: 700; font-size: 0.95rem; letter-spacing: 0.02em; white-space: nowrap; }
.brand span { color: #7dd3fc; font-weight: 500; font-size: 0.8rem; margin-left: 0.4rem; }
.nav-links { display: flex; gap: 2px; flex-wrap: wrap; overflow-x: auto; }
.nav-links button { background: none; border: none; color: #a8b4c4; padding: 0.45rem 0.7rem; font-size: 0.82rem; font-weight: 500; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.nav-links button:hover { color: #fff; background: rgba(255,255,255,0.08); }
.nav-links button.active { color: #fff; background: var(--primary); }
.nav-right { display: flex; align-items: center; gap: 0.5rem; }
.nav-right .sync-status { font-size: 0.72rem; color: #94a3b8; white-space: nowrap; }
.nav-right .sync-status.ok { color: #86efac; }
.nav-right .sync-status.err { color: #fca5a5; }
.nav-right button { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 7px; font-weight: 600; cursor: pointer; font-size: 0.88rem; min-height: 38px; }
.nav-right button:hover { background: var(--primary-h); }
.nav-right .btn-ghost { background: transparent; border: 1px solid #3d4f66; color: #cbd5e1; }
.nav-right .btn-ghost:hover { border-color: #7dd3fc; color: #fff; }
.nav-right .btn-ghost:hover { background: rgba(255,255,255,0.08); }

.container { max-width: 1280px; margin: 0 auto; padding: 1rem 1.1rem 2rem; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.6rem; }
.page-header h1 { font-size: 1.25rem; }
.page-header .count { font-weight: 400; color: var(--muted); font-size: 0.9rem; }
.search-box { display: flex; gap: 0.35rem; }
.search-box input { padding: 0.45rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; width: min(280px, 70vw); font-size: 0.9rem; background: #fff; }
.search-box button, .btn {
  padding: 0.55rem 1.1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
  border: none; cursor: pointer; min-height: 42px; display: inline-flex; align-items: center; justify-content: center;
  gap: 0.35rem; transition: background .15s, transform .1s, box-shadow .15s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(26,86,168,.25); }
.btn-primary:hover { background: var(--primary-h); }
.btn-secondary { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-dim); }
.btn-danger { background: #fff; color: var(--danger); border: 1.5px solid #fca5a5; }
.btn-danger:hover { background: #fef2f2; border-color: var(--danger); }
.btn-lg { padding: 0.7rem 1.4rem; font-size: 1rem; min-height: 48px; min-width: 120px; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.form-actions .btn { min-width: 110px; }
.note-form .btn { flex-shrink: 0; min-width: 90px; }

.make-section { margin-bottom: 1.5rem; }
.make-title {
  font-size: 1.05rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  border-bottom: 2px solid var(--primary); padding-bottom: 0.35rem; margin-bottom: 0.65rem; color: var(--primary);
}
.model-title {
  font-size: 0.88rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
  color: var(--text); margin: 0.9rem 0 0.45rem; padding: 0.35rem 0.6rem;
  background: var(--bg-soft); border-radius: 5px; border-left: 3px solid var(--accent);
}
.model-title .model-count { font-weight: 400; color: var(--muted); font-size: 0.8rem; letter-spacing: 0; text-transform: none; }

.vehicle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.85rem; }
.vehicle-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s;
  display: flex; flex-direction: column;
}
.vehicle-card:hover { box-shadow: 0 8px 24px rgba(26,35,50,.12); transform: translateY(-2px); border-color: var(--primary); }
.card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--bg-soft); display: block; }
.card-img-placeholder {
  width: 100%; aspect-ratio: 4/3; background: linear-gradient(135deg, #e8eef6, #d0d8e4);
  display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.8rem;
}
.card-body { padding: 0.7rem 0.8rem 0.85rem; display: flex; flex-direction: column; gap: 0.2rem; flex: 1; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.4rem; }
.card-top .model { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.02em; }
.card-top .price { font-weight: 700; color: var(--primary); white-space: nowrap; }
.spec { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
.meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
.reg { font-weight: 700; letter-spacing: 0.5px; font-size: 0.85rem; margin-top: 0.25rem; }
.colour { font-size: 0.75rem; color: var(--muted); }
.days { font-size: 0.7rem; color: var(--muted); }
.flags { display: flex; flex-wrap: wrap; gap: 0.2rem; margin-top: 0.3rem; }
.flag { font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 3px; background: var(--bg-soft); color: var(--muted); font-weight: 600; }


.filters-bar {
  display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: center;
  margin-bottom: 1rem; padding: 0.75rem 0.9rem; background: var(--card);
  border: 1px solid var(--border); border-radius: 10px;
}
.filters-bar label { font-size: 0.75rem; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 0.2rem; }
.filters-bar select, .filters-bar input {
  padding: 0.4rem 0.55rem; border: 1px solid var(--border); border-radius: 6px;
  font-size: 0.85rem; background: #fff; min-width: 110px; color: var(--text);
}
.filters-bar .filter-row { display: flex; gap: 0.4rem; align-items: flex-end; flex-wrap: wrap; }
.badge-service {
  display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 0.15rem 0.4rem;
  border-radius: 4px; margin-top: 0.25rem; letter-spacing: 0.02em;
}
.badge-fsh { background: #dcfce7; color: #166534; }
.badge-mfr { background: #dbeafe; color: #1e40af; }
.badge-part { background: #fef3c7; color: #92400e; }
.badge-none { background: #f3f4f6; color: #6b7280; }

.empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }

.overlay { position: fixed; inset: 0; background: rgba(15,20,30,0.45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 1.5rem 1rem; overflow-y: auto; }
.modal { background: var(--card); border-radius: 12px; width: 100%; max-width: 920px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 1px solid var(--border); }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1.15rem; border-bottom: 1px solid var(--border); }
.modal-header h2 { font-size: 1.1rem; }
.modal-body { padding: 1.15rem; }
.modal-close { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: var(--muted); line-height: 1; width: 42px; height: 42px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--bg-soft); color: var(--text); }

.detail-grid { display: grid; grid-template-columns: 1fr 260px; gap: 1.15rem; }
@media (max-width: 720px) {
  .detail-grid { grid-template-columns: 1fr; }
  .top-nav { flex-wrap: wrap; height: auto; padding: 0.5rem; gap: 0.4rem; }
}
.photo-box { border-radius: 8px; overflow: hidden; background: var(--bg-soft); margin-bottom: 0.9rem; border: 1px solid var(--border); }
.photo-box img { width: 100%; display: block; aspect-ratio: 16/10; object-fit: cover; }
.photo-box .no-photo { height: 160px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.price-lg { font-size: 1.65rem; font-weight: 700; color: var(--primary); margin: 0.5rem 0; }
.info-box { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem; margin-bottom: 0.8rem; }
.info-box h3 { font-size: 0.8rem; margin-bottom: 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.info-box dl { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 0.7rem; font-size: 0.82rem; }
.info-box dt { color: var(--muted); }
.info-box dd { font-weight: 500; }

.notes-area { margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; }
.notes-area h3 { margin-bottom: 0.6rem; font-size: 0.95rem; }
.note-form { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; }
.note-form textarea { flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.85rem; resize: vertical; min-height: 56px; }
.note-item { background: var(--bg-soft); border-left: 3px solid var(--primary); padding: 0.55rem 0.8rem; border-radius: 0 6px 6px 0; margin-bottom: 0.45rem; }
.note-date { font-size: 0.7rem; color: var(--muted); }
.note-text { font-size: 0.85rem; white-space: pre-wrap; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
@media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
.form-row { margin-bottom: 0.7rem; }
.form-row label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 0.2rem; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 0.42rem 0.6rem; border: 1px solid var(--border); border-radius: 5px; font-size: 0.88rem; font-family: inherit; background: #fff;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; }
fieldset { border: 1px solid var(--border); border-radius: 7px; padding: 0.7rem 0.9rem; margin: 0.9rem 0; }
legend { font-size: 0.82rem; font-weight: 600; padding: 0 0.25rem; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.25rem 0.7rem; margin-top: 0.35rem; }
.check-grid label { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; cursor: pointer; }
.form-actions { display: flex; gap: 0.55rem; margin-top: 1rem; padding-top: 0.9rem; border-top: 1px solid var(--border); }

@media print {
  .top-nav, .no-print, .overlay { display: none !important; }
  body { background: #fff; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="brand">Dealer Stock <span>Burton</span></div>
  <div class="nav-links" id="navLinks">
    <button data-cat="Stock" class="active">Stock</button>
    <button data-cat="Demonstrators">Demonstrators</button>
    <button data-cat="Pre-reg">Pre-reg</button>
    <button data-cat="Commercials">Commercials</button>
    <button data-cat="Arriving Soon">Arriving Soon</button>
    <button data-cat="Sold">Sold</button>
    <button data-cat="Delivered">Delivered</button>
    <button data-cat="All">All</button>
  </div>
  <div class="nav-right">
    <span class="sync-status" id="syncStatus">Loading…</span>
    <button class="btn-ghost" onclick="location.reload()" title="Reload stock from server">↻ Refresh</button>
    <button type="button" onclick="openForm()">+ Add vehicle</button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1 id="pageTitle">Stock <span class="count" id="countLabel">(0)</span></h1>
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="Search reg, make, model, colour…">
      <button type="button" class="btn btn-primary" onclick="renderList()">Search</button>
    </div>
  </div>
  
  <div class="filters-bar" id="filtersBar">
    <div class="filter-row">
      <label>Fuel
        <select id="filterFuel" onchange="renderList()">
          <option value="">All fuels</option>
          <option>Petrol</option>
          <option>Diesel</option>
          <option>Hybrid</option>
          <option>Plug-in Hybrid</option>
          <option>Electric</option>
        </select>
      </label>
      <label>Min £
        <input type="number" id="filterMinPrice" placeholder="0" min="0" step="100" onchange="renderList()" oninput="debounceRender()">
      </label>
      <label>Max £
        <input type="number" id="filterMaxPrice" placeholder="Any" min="0" step="100" onchange="renderList()" oninput="debounceRender()">
      </label>
      <label>Sort by
        <select id="sortBy" onchange="renderList()">
          <option value="default">Brand / model / price</option>
          <option value="price-asc">Price: low → high</option>
          <option value="price-desc">Price: high → low</option>
          <option value="mileage-asc">Mileage: low → high</option>
          <option value="mileage-desc">Mileage: high → low</option>
          <option value="year-desc">Year: newest</option>
          <option value="year-asc">Year: oldest</option>
        </select>
      </label>
      <button type="button" class="btn btn-secondary" onclick="clearFilters()" style="min-height:38px;margin-top:1.1rem">Clear filters</button>
    </div>
  </div>

  <div id="listArea"></div>
</div>

<div class="overlay" id="detailModal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">Vehicle</h2>
      <div class="modal-actions no-print">
        <button type="button" class="btn btn-secondary" onclick="printStockCard()" title="Print stock card">🖨 Stock card</button>
        <button type="button" class="btn btn-primary btn-lg" onclick="editCurrent()">✏️ Edit vehicle</button>
        <button type="button" class="btn btn-danger" onclick="deleteCurrent()">Remove</button>
        <button type="button" class="modal-close" onclick="closeModal()" title="Close" aria-label="Close">&times;</button>
      </div>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<div class="overlay" id="formModal" style="display:none">
  <div class="modal" style="max-width:920px">
    <div class="modal-header">
      <h2 id="formTitle">Add Vehicle</h2>
      <button class="modal-close" onclick="closeForm()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="vehicleForm" onsubmit="saveVehicle(event)">
        <input type="hidden" id="f_id">
        <div class="form-grid">
          <div>
            <div class="form-row">
              <label>Registration *</label>
              <input id="f_registration" required style="text-transform:uppercase" placeholder="e.g. AB12 CDE">
            </div>
            <div class="form-row two">
              <div><label>Make *</label><input id="f_make" required></div>
              <div><label>Model *</label><input id="f_model" required></div>
            </div>
            <div class="form-row"><label>Derivative</label><input id="f_derivative"></div>
            <div class="form-row three">
              <div><label>Mileage</label><input type="number" id="f_mileage"></div>
              <div><label>Year</label><input type="number" id="f_model_year" min="1990" max="2030"></div>
              <div><label>Doors</label><input type="number" id="f_doors"></div>
            </div>
            <div class="form-row three">
              <div><label>Transmission</label>
                <select id="f_transmission"><option value="">–</option><option>Manual</option><option>Automatic</option><option>Semi-Auto</option></select>
              </div>
              <div><label>Fuel</label>
                <select id="f_fuel"><option value="">–</option><option>Petrol</option><option>Diesel</option><option>Hybrid</option><option>Plug-in Hybrid</option><option>Electric</option></select>
              </div>
              <div><label>Body</label>
                <select id="f_body_type"><option value="">–</option><option>Hatchback</option><option>Saloon</option><option>Estate</option><option>SUV</option><option>Coupe</option><option>MPV</option><option>Van</option></select>
              </div>
            </div>
            <div class="form-row"><label>Colour</label><input id="f_colour"></div>
            <div class="form-row"><label>Image URL</label><input id="f_image_url" placeholder="https://…"></div>
          </div>
          <div>
            <div class="form-row two">
              <div><label>Retail Price (£)</label><input type="number" step="0.01" id="f_retail_price"></div>
              <div><label>In stock since</label><input type="date" id="f_bring_into_stock_date"></div>
            </div>
            <div class="form-row two">
              <div><label>Category</label>
                <select id="f_category">
                  <option>Stock</option><option>Demonstrators</option><option>Pre-reg</option><option>Commercials</option>
                  <option>Arriving Soon</option><option>Sold</option><option>Delivered</option>
                </select>
              </div>
              <div><label>Service History</label>
                <select id="f_service_history">
                  <option value="">–</option>
                  <option value="Full Service History">Full Service History (FSH)</option>
                  <option value="Full Manufacturer">Full Manufacturer</option>
                  <option value="Part Service">Part Service</option>
                  <option value="No History">No History</option>
                </select>
              </div>
            </div>
            <div class="form-row"><label>Service notes</label><input id="f_service_history_notes"></div>
            <div class="form-row"><label>Special offer</label><input id="f_special_offer"></div>
            <div class="form-row"><label>Sales note</label><textarea id="f_new_note" rows="2"></textarea></div>
          </div>
        </div>
        <fieldset>
          <legend>Status Flags</legend>
          <div class="check-grid" id="statusFlags"></div>
        </fieldset>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-lg">💾 Save changes</button>
          <button type="button" class="btn btn-secondary btn-lg" onclick="closeForm()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
const FLAGS = ['Pre-Reg','Awaiting Prep','Bodyshop','Workshop','Lower Price','Special Offer','On Loan','Other','Auction','Deposit Taken'];
const IMPORTED_STOCK = [];
let vehicles = JSON.parse(localStorage.getItem('dealerStock') || 'null') || [];
const IMPORT_VERSION = 'pentagon-burton-live';
let currentCat = 'Stock';
let currentId = null;


function serviceBadge(v) {
  const s = (v.service_history || '').trim();
  if (!s) return '';
  let cls = 'badge-none', label = s;
  const low = s.toLowerCase();
  if (low.includes('full service') || low === 'fsh') { cls = 'badge-fsh'; label = 'FSH'; }
  else if (low.includes('manufacturer')) { cls = 'badge-mfr'; label = 'Full manufacturer'; }
  else if (low.includes('part')) { cls = 'badge-part'; label = 'Part service'; }
  else if (low.includes('no history')) { cls = 'badge-none'; label = 'No history'; }
  return `<span class="badge-service ${cls}">${label}</span>`;
}

let _debounceTimer;
function debounceRender() {
  clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(renderList, 300);
}

function clearFilters() {
  document.getElementById('filterFuel').value = '';
  document.getElementById('filterMinPrice').value = '';
  document.getElementById('filterMaxPrice').value = '';
  document.getElementById('sortBy').value = 'default';
  document.getElementById('searchInput').value = '';
  renderList();
}

function setLastSynced(isoOrText) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (!isoOrText) return;
  let text = isoOrText;
  if (/^\d{4}-/.test(String(isoOrText)) || isoOrText instanceof Date) {
    const d = new Date(isoOrText);
    text = 'Synced ' + d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' });
  }
  el.textContent = text;
  el.className = 'sync-status ok';
}


function setSyncStatus(text, cls) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = text;
  el.className = 'sync-status' + (cls ? ' ' + cls : '');
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function daysInStock(v) {
  if (!v.bring_into_stock_date) return null;
  const d = new Date(v.bring_into_stock_date);
  return Math.floor((Date.now() - d) / 86400000);
}

function save() {
  localStorage.setItem('dealerStock', JSON.stringify(vehicles));
}


function formatSpec(d) {
  if (!d) return '';
  let s = String(d).trim();
  // 12 PureTech / 10 TFSI / 20 TDI → 1.2 / 1.0 / 2.0
  s = s.replace(/\b([1-3])(\d)\s+(PureTech|Puretech|TFSI|Tfsi|TSI|Tsi|TDI|Tdi|HDi|Hdi|BlueHDi|Bluehdi|EcoBoost|Ecoboost|THP|Thp|VTi|Vti|dCi|Dci|CDTI|Cdti|Multijet|GDI|Gdi|DM-?i|Dm|Skyactiv)\b/i,
    (_, a, b, eng) => a + '.' + b + ' ' + eng);
  // Title/acronym tidy
  const map = [
    [/\bPuretech\b/gi, 'PureTech'], [/\bTfsi\b/g, 'TFSI'], [/\bTsi\b/g, 'TSI'],
    [/\bTdi\b/g, 'TDI'], [/\bHdi\b/gi, 'HDi'], [/\bBluehdi\b/gi, 'BlueHDi'],
    [/\bEcoboost\b/gi, 'EcoBoost'], [/\bEat6\b/gi, 'EAT6'], [/\bEat8\b/gi, 'EAT8'],
    [/\bSs\b/g, 's/s'], [/\bPs\b/g, 'PS'], [/\bS Tronic\b/gi, 'S tronic'],
    [/\bDm I\b/gi, 'DM-i'], [/\bAwd\b/g, 'AWD'], [/\bCvt\b/g, 'CVT'],
    [/\bKwh\b/gi, 'kWh'],
  ];
  map.forEach(([pat, rep]) => { s = s.replace(pat, rep); });
  return s.replace(/\s+/g, ' ').trim();
}

function fmtPrice(p) {
  if (p == null || p === '') return '—';
  return '£' + Number(p).toLocaleString('en-GB', { maximumFractionDigits: 0 });
}

function naturalModelKey(model) {
  const m = model || '';
  const nums = m.match(/\d+/);
  if (nums) return [0, parseInt(nums[0], 10), m.toLowerCase()];
  return [1, 0, m.toLowerCase()];
}

function groupVehicles(list) {
  const byMake = {};
  list.forEach(v => {
    const make = (v.make || 'Unknown').toUpperCase();
    if (!byMake[make]) byMake[make] = {};
    const model = (v.model || 'Unknown').toUpperCase();
    if (!byMake[make][model]) byMake[make][model] = [];
    byMake[make][model].push(v);
  });
  Object.keys(byMake).forEach(make => {
    Object.keys(byMake[make]).forEach(model => {
      byMake[make][model].sort((a, b) => (a.retail_price || 1e12) - (b.retail_price || 1e12));
    });
  });
  return byMake;
}

function cardHtml(v) {
  const flags = (v.status_flags || []).map(f => `<span class="flag">${f}</span>`).join('');
  const img = v.image_url
    ? `<img class="card-img" src="${v.image_url}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-img-placeholder',textContent:'No photo'}))">`
    : `<div class="card-img-placeholder">No photo</div>`;
  return `<div class="vehicle-card" onclick="openDetail('${v.id}')">
    ${img}
    <div class="card-body">
      <div class="card-top"><span class="model">${v.model || ''}</span><span class="price">${fmtPrice(v.retail_price)}</span></div>
      <div class="spec">${formatSpec(v.derivative || '')}</div>
      <div class="meta"><span>${v.model_year || '—'} · ${(v.mileage||0).toLocaleString()} mi</span><span>${v.fuel || ''} ${v.transmission || ''}</span></div>
      <div class="reg">${v.registration || ''}</div>
      <div class="colour">${v.colour || ''}</div>
      ${serviceBadge(v)}${flags ? `<div class="flags">${flags}</div>` : ''}
    </div>
  </div>`;
}

function renderList() {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const fuel = (document.getElementById('filterFuel') || {}).value || '';
  const minP = parseFloat((document.getElementById('filterMinPrice') || {}).value);
  const maxP = parseFloat((document.getElementById('filterMaxPrice') || {}).value);
  const sortBy = (document.getElementById('sortBy') || {}).value || 'default';
  let list = vehicles.filter(v => currentCat === 'All' || v.category === currentCat);
  if (q) {
    list = list.filter(v =>
      (v.registration||'').toLowerCase().includes(q) ||
      (v.make||'').toLowerCase().includes(q) ||
      (v.model||'').toLowerCase().includes(q) ||
      (v.derivative||'').toLowerCase().includes(q) ||
      (v.colour||'').toLowerCase().includes(q)
    );
  }
  if (fuel) {
    list = list.filter(v => (v.fuel || '').toLowerCase().includes(fuel.toLowerCase()));
  }
  if (!isNaN(minP)) list = list.filter(v => v.retail_price != null && v.retail_price >= minP);
  if (!isNaN(maxP)) list = list.filter(v => v.retail_price != null && v.retail_price <= maxP);
  if (sortBy === 'price-asc') list = list.slice().sort((a,b) => (a.retail_price||1e12) - (b.retail_price||1e12));
  else if (sortBy === 'price-desc') list = list.slice().sort((a,b) => (b.retail_price||0) - (a.retail_price||0));
  else if (sortBy === 'mileage-asc') list = list.slice().sort((a,b) => (a.mileage||1e12) - (b.mileage||1e12));
  else if (sortBy === 'mileage-desc') list = list.slice().sort((a,b) => (b.mileage||0) - (a.mileage||0));
  else if (sortBy === 'year-desc') list = list.slice().sort((a,b) => (b.model_year||0) - (a.model_year||0));
  else if (sortBy === 'year-asc') list = list.slice().sort((a,b) => (a.model_year||0) - (b.model_year||0));

  document.getElementById('countLabel').textContent = '(' + list.length + ')';
  document.getElementById('pageTitle').childNodes[0].textContent = currentCat + ' ';
  const area = document.getElementById('listArea');
  if (!list.length) {
    area.innerHTML = '<div class="empty">No vehicles found.</div>';
    return;
  }
  if (sortBy !== 'default') {
    area.innerHTML = `<div class="vehicle-grid">${list.map(cardHtml).join('')}</div>`;
    return;
  }
  const grouped = groupVehicles(list);
  const makes = Object.keys(grouped).sort();
  let html = '';
  makes.forEach(make => {
    html += `<section class="make-section"><h2 class="make-title">${make}</h2>`;
    const models = Object.keys(grouped[make]).sort((a, b) => {
      const ka = naturalModelKey(a), kb = naturalModelKey(b);
      return ka[0]-kb[0] || ka[1]-kb[1] || ka[2].localeCompare(kb[2]);
    });
    models.forEach(model => {
      const cars = grouped[make][model];
      html += `<h3 class="model-title">${model} <span class="model-count">(${cars.length})</span></h3>`;
      html += `<div class="vehicle-grid">${cars.map(cardHtml).join('')}</div>`;
    });
    html += `</section>`;
  });
  area.innerHTML = html;
}

function openDetail(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  currentId = id;
  document.getElementById('detailTitle').textContent = `${(v.make||'').toUpperCase()} ${(v.model||'').toUpperCase()} · ${v.registration||''}`;
  const photo = v.image_url
    ? `<div class="photo-box"><img src="${v.image_url}" alt=""></div>`
    : `<div class="photo-box"><div class="no-photo">No photo</div></div>`;
  const notes = (v.notes || []).map(n =>
    `<div class="note-item"><div class="note-date">${n.date || ''}</div><div class="note-text">${(n.text||'').replace(/</g,'&lt;')}</div></div>`
  ).join('') || '<p style="color:var(--muted);font-size:0.85rem">No notes yet.</p>';
  const link = v.detail_url ? `<p style="margin-top:0.5rem"><a href="${v.detail_url}" target="_blank" rel="noopener" style="color:var(--primary)">View on Pentagon site ↗</a></p>` : '';
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-grid">
      <div>
        ${photo}
        <div class="price-lg">${fmtPrice(v.retail_price)}</div>
        ${v.special_offer ? `<div style="color:var(--accent);font-weight:600;margin-bottom:0.5rem">${v.special_offer}</div>` : ''}
        <div class="info-box">
          <h3>Details</h3>
          <dl>
            <dt>Registration</dt><dd>${v.registration||'—'}</dd>
            <dt>Colour</dt><dd>${v.colour||'—'}</dd>
            <dt>Year</dt><dd>${v.model_year||'—'}</dd>
            <dt>Mileage</dt><dd>${v.mileage != null ? v.mileage.toLocaleString() : '—'}</dd>
            <dt>Fuel</dt><dd>${v.fuel||'—'}</dd>
            <dt>Transmission</dt><dd>${v.transmission||'—'}</dd>
            <dt>Body</dt><dd>${v.body_type||'—'}</dd>
            <dt>Doors</dt><dd>${v.doors||'—'}</dd>
            <dt>Service</dt><dd>${v.service_history||'—'}</dd>
            
          </dl>
        </div>
        ${link}
        <div class="notes-area">
          <h3>Sales notes</h3>
          <div class="note-form no-print">
            <textarea id="newNoteText" placeholder="Add a note…"></textarea>
            <button class="btn btn-primary" type="button" onclick="addNote()">Add note</button>
          </div>
          <div id="notesList">${notes}</div>
        </div>
      </div>
      <div>
        <div class="info-box">
          <h3>Spec</h3>
          <p style="font-size:0.85rem">${formatSpec(v.derivative)||'—'}</p>
        </div>
        <div class="info-box">
          <h3>Flags</h3>
          <p style="font-size:0.85rem">${(v.status_flags||[]).join(', ') || '—'}</p>
        </div>
      </div>
    </div>`;
  document.getElementById('detailModal').style.display = 'flex';
}

function closeModal() { document.getElementById('detailModal').style.display = 'none'; currentId = null; }

async function addNote() {
  const v = vehicles.find(x => x.id === currentId);
  if (!v) return;
  const text = (document.getElementById('newNoteText').value || '').trim();
  if (!text) return;
  if (!v.notes) v.notes = [];
  v.notes.unshift({ date: new Date().toLocaleString('en-GB', { timeZone: 'Europe/London' }), text });
  save();
  openDetail(currentId);
  const r = await sharedSave({ registration: v.registration, add_note: text });
  if (!r.ok) alert('Note saved on this device only — shared save needs setup: ' + (r.error || ''));
  else setSyncStatus('Note shared with team', 'ok');
}

function deleteCurrent() {
  if (!currentId || !confirm('Remove this vehicle from your list?')) return;
  vehicles = vehicles.filter(v => v.id !== currentId);
  save();
  closeModal();
  renderList();
}

function printStockCard() {
  window.print();
}

function editCurrent() {
  const v = vehicles.find(x => x.id === currentId);
  if (!v) return;
  closeModal();
  openForm(v);
}

function openForm(v) {
  document.getElementById('formTitle').textContent = v ? 'Edit Vehicle' : 'Add Vehicle';
  document.getElementById('f_id').value = v ? v.id : '';
  const fields = ['registration','make','model','derivative','mileage','model_year','doors','transmission','fuel','body_type','colour','image_url','retail_price','bring_into_stock_date','category','service_history','service_history_notes','special_offer'];
  fields.forEach(f => {
    const el = document.getElementById('f_' + f);
    if (!el) return;
    el.value = v && v[f] != null ? v[f] : (f === 'category' ? 'Stock' : '');
  });
  document.getElementById('f_new_note').value = '';
  const sf = document.getElementById('statusFlags');
  sf.innerHTML = FLAGS.map(f => {
    const checked = v && (v.status_flags||[]).includes(f) ? 'checked' : '';
    return `<label><input type="checkbox" value="${f}" ${checked}> ${f}</label>`;
  }).join('');
  document.getElementById('formModal').style.display = 'flex';
}

function closeForm() { document.getElementById('formModal').style.display = 'none'; }

function saveVehicle(e) {
  e.preventDefault();
  const id = document.getElementById('f_id').value || uid();
  const existing = vehicles.find(v => v.id === id);
  const flags = [...document.querySelectorAll('#statusFlags input:checked')].map(c => c.value);
  const data = {
    id,
    registration: document.getElementById('f_registration').value.trim().toUpperCase(),
    make: document.getElementById('f_make').value.trim(),
    model: document.getElementById('f_model').value.trim(),
    derivative: document.getElementById('f_derivative').value.trim(),
    mileage: Number(document.getElementById('f_mileage').value) || null,
    model_year: Number(document.getElementById('f_model_year').value) || null,
    doors: Number(document.getElementById('f_doors').value) || null,
    transmission: document.getElementById('f_transmission').value,
    fuel: document.getElementById('f_fuel').value,
    body_type: document.getElementById('f_body_type').value,
    colour: document.getElementById('f_colour').value.trim(),
    image_url: document.getElementById('f_image_url').value.trim(),
    retail_price: Number(document.getElementById('f_retail_price').value) || null,
    bring_into_stock_date: document.getElementById('f_bring_into_stock_date').value || new Date().toISOString().slice(0,10),
    category: document.getElementById('f_category').value,
    service_history: document.getElementById('f_service_history').value,
    service_history_notes: document.getElementById('f_service_history_notes').value.trim(),
    special_offer: document.getElementById('f_special_offer').value.trim(),
    status_flags: flags,
    notes: existing ? (existing.notes || []) : [],
    source: existing ? existing.source : 'manual',
  };
  const note = document.getElementById('f_new_note').value.trim();
  if (note) data.notes.unshift({ date: new Date().toLocaleString('en-GB'), text: note });
  if (existing) {
    Object.assign(existing, data);
  } else {
    vehicles.push(data);
  }
  save();
  closeForm();
  renderList();
  sharedSave({
    registration: data.registration,
    service_history: data.service_history,
    service_history_notes: data.service_history_notes,
    status_flags: data.status_flags,
    special_offer: data.special_offer,
    category: data.category,
    notes: data.notes,
  }).then(r => {
    if (r.ok) setSyncStatus('Changes shared with team', 'ok');
    else console.warn('Shared save', r.error);
  });
}

document.getElementById('navLinks').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#navLinks button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentCat = e.target.dataset.cat;
  renderList();
});
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') renderList(); });
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) { closeModal(); closeForm(); } });
});


async function sharedSave(payload) {
  try {
    const res = await fetch('/api/save-override', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      console.warn('Shared save failed', data);
      return { ok: false, error: data.error || res.statusText };
    }
    return { ok: true, data };
  } catch (e) {
    console.warn(e);
    return { ok: false, error: String(e) };
  }
}

async function loadFromVehiclesJson() {
  if (!location.protocol.startsWith('http')) return false;
  try {
    setSyncStatus('Loading…', '');
    const res = await fetch('./vehicles.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const list = await res.json();
    if (!Array.isArray(list) || !list.length) throw new Error('Empty');
    // Keep manual team data across stock refresh (notes / service history are NOT on the website)
    const prevByReg = {};
    (vehicles || []).forEach(v => {
      if (v && v.registration) prevByReg[v.registration] = v;
    });
    let imgMap = {};
    try {
      const ir = await fetch('./images_map.json?t=' + Date.now(), { cache: 'no-store' });
      if (ir.ok) imgMap = await ir.json();
    } catch (_) {}
    let overrides = {};
    try {
      const or = await fetch('./overrides.json?t=' + Date.now(), { cache: 'no-store' });
      if (or.ok) overrides = await or.json();
    } catch (_) {}
    vehicles = list.map(v => {
      const prev = prevByReg[v.registration] || {};
      const o = overrides[v.registration] || overrides[v.id] || {};
      // Priority: shared overrides → previous session → scraped stock (usually empty for these fields)
      v.notes = (o.notes != null ? o.notes : null) ?? (prev.notes || []) ;
      v.service_history = (o.service_history != null ? o.service_history : null) ?? (prev.service_history || '');
      v.service_history_notes = (o.service_history_notes != null ? o.service_history_notes : null) ?? (prev.service_history_notes || '');
      v.status_flags = (o.status_flags != null ? o.status_flags : null) ?? (prev.status_flags || []);
      v.special_offer = (o.special_offer != null ? o.special_offer : null) ?? (prev.special_offer || v.special_offer || '');
      // Category: Sold/Delivered etc from overrides or previous, else scraped
      if (o.category) v.category = o.category;
      else if (prev.category && prev.category !== 'Stock' && v.category === 'Stock') {
        // keep manual categories only if scrape still says Stock and we had something else
        // (Sold is set by server sync when car leaves website)
      }
      if (prev.bring_into_stock_date && !v.bring_into_stock_date) v.bring_into_stock_date = prev.bring_into_stock_date;
      if (!v.image_url && imgMap[v.registration]) v.image_url = imgMap[v.registration];
      return v;
    });
    localStorage.setItem('dealerStock', JSON.stringify(vehicles));
    localStorage.setItem('dealerStockVersion', IMPORT_VERSION);
    setSyncStatus(vehicles.length + ' cars · synced ' + new Date().toLocaleString('en-GB', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}), 'ok');
    return true;
  } catch (e) {
    console.warn(e);
    return false;
  }
}

(async function init() {
  if (await loadFromVehiclesJson()) { renderList(); return; }
  if (!vehicles.length) vehicles = IMPORTED_STOCK;
  setSyncStatus(vehicles.length ? vehicles.length + ' cars · local' : 'No data', '');
  renderList();
})();
</script>
