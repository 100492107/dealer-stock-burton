<title>Dealer Stock Manager · Burton</title>
<style>
:root {
  --bg: #f0f3f8;
  --bg-soft: #e8edf5;
  --card: #ffffff;
  --border: #d5dce8;
  --text: #152033;
  --muted: #64748b;
  --primary: #1a56a8;
  --primary-h: #134785;
  --primary-dim: #e8f0fb;
  --accent: #0d9488;
  --danger: #dc2626;
  --success: #16a34a;
  --nav: #0f172a;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow-hover: 0 10px 28px rgba(15, 23, 42, 0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.45; min-height: 100vh;
}

/* Nav */
.top-nav {
  background: var(--nav); color: #fff;
  display: flex; align-items: center; gap: 1rem;
  padding: 0 1.25rem; height: 56px;
  position: sticky; top: 0; z-index: 50;
}
.brand { min-width: 0; max-width: 70%;
  display: inline-flex; align-items: center; gap: 0.55rem;
  font-weight: 700; font-size: 0.95rem; letter-spacing: 0.02em;
  background: none; border: none; color: #fff; cursor: pointer;
  padding: 0; font-family: inherit; white-space: nowrap; flex-shrink: 0;
}
.brand:hover span { color: #7dd3fc; }
.brand-logo { width: 30px; height: 30px; border-radius: 50%; display: block; flex-shrink: 0; }
.brand-text { display: inline; }
.brand span { color: #7dd3fc; font-weight: 500; font-size: 0.8rem; margin-left: 0.15rem; }
.nav-links {
  display: flex; align-items: center; gap: 0.15rem;
  flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none;
}
.nav-links::-webkit-scrollbar { display: none; }
.nav-links button {
  background: none; border: none; color: #94a3b8;
  padding: 0.4rem 0.75rem; font-size: 0.8rem; font-weight: 500;
  border-radius: 6px; cursor: pointer; white-space: nowrap; font-family: inherit;
}
.nav-links button:hover { color: #fff; background: rgba(255,255,255,0.08); }
.nav-links button.active { color: #fff; background: var(--primary); }
.nav-right {
  display: flex; align-items: center; gap: 0.45rem; flex-shrink: 0; margin-left: auto;
}
.sync-status, .nav-right .sync-status {
  font-size: 0.72rem; color: #94a3b8; max-width: 200px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sync-status.ok, .nav-right .sync-status.ok { color: #86efac; }
.sync-status.err, .nav-right .sync-status.err { color: #fca5a5; }
.btn-ghost {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
  color: #e2e8f0; padding: 0.4rem 0.7rem; border-radius: 6px;
  font-size: 0.78rem; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap;
}
.btn-ghost:hover { background: rgba(255,255,255,0.12); color: #fff; }
.nav-right > button:last-child {
  background: var(--primary); border: none; color: #fff;
  padding: 0.42rem 0.85rem; border-radius: 6px;
  font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit;
}
.nav-right > button:last-child:hover { background: var(--primary-h); }

/* Layout */
.container { max-width: 1280px; margin: 0 auto; padding: 1.25rem 1.5rem 2.5rem; }
.page-header {
  display: flex; justify-content: space-between; align-items: center;
  gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;
}
.page-header h1 { font-size: 1.35rem; font-weight: 700; }
.page-header .count { font-weight: 500; color: var(--muted); font-size: 0.95rem; }
.search-box { display: flex; gap: 0.4rem; align-items: center; flex: 1; max-width: 460px; min-width: 200px; }
.search-box input {
  flex: 1; min-width: 0; padding: 0.55rem 0.85rem;
  border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: #fff;
}
.search-box input:focus {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,86,168,0.15);
}
.btn-clear-search {
  background: #fff; color: var(--primary); border: 1.5px solid var(--primary);
  padding: 0.5rem 0.85rem; border-radius: 8px; font-weight: 600;
  font-size: 0.85rem; cursor: pointer; white-space: nowrap; font-family: inherit;
}
.btn-clear-search:hover { background: var(--primary-dim); }
.btn, .btn-primary, .btn-secondary, .btn-danger {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0.5rem 0.95rem; border-radius: 8px; font-size: 0.88rem;
  font-weight: 600; cursor: pointer; border: none; font-family: inherit; min-height: 40px;
}
.btn-primary, .btn.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-h); }
.btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-soft); }
.btn-danger { background: #fff; color: var(--danger); border: 1.5px solid #fca5a5; }
.btn-lg { padding: 0.7rem 1.4rem; font-size: 1rem; min-height: 48px; min-width: 120px; }

/* Filters */
.filters-bar {
  display: flex; flex-wrap: wrap; gap: 0.65rem 1rem; align-items: flex-end;
  margin-bottom: 1.15rem; padding: 0.85rem 1rem;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.filters-bar .filter-row { display: flex; flex-wrap: wrap; gap: 0.65rem 0.85rem; align-items: flex-end; flex: 1; }
.filters-bar label {
  display: flex; flex-direction: column; gap: 0.25rem;
  font-size: 0.72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em;
}
.filters-bar select, .filters-bar input {
  padding: 0.45rem 0.65rem; border: 1px solid var(--border); border-radius: 7px;
  font-size: 0.88rem; background: #fff; color: var(--text); min-width: 110px; font-family: inherit;
}
.filters-bar select:focus, .filters-bar input:focus {
  outline: none; border-color: var(--primary);
}
#syncStatusMobile { display: none; font-size: 0.75rem; color: var(--muted); padding: 0 0 0.5rem; }

/* Brand / model headings (actual JS class names) */
.make-section { margin-bottom: 1.75rem; }
.make-title {
  font-size: 1.05rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--primary); border-bottom: 2px solid var(--primary);
  padding-bottom: 0.4rem; margin-bottom: 0.75rem;
}
.model-title {
  font-size: 0.88rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
  color: var(--text); margin: 1rem 0 0.5rem; padding: 0.4rem 0.7rem;
  background: var(--bg-soft); border-radius: 6px; border-left: 3px solid var(--accent);
}
.model-title .model-count {
  font-weight: 400; color: var(--muted); font-size: 0.8rem;
  letter-spacing: 0; text-transform: none;
}

/* Cards */
.vehicle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
}
.vehicle-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: visible; cursor: pointer; display: flex; flex-direction: column;
  box-shadow: var(--shadow);
  transition: box-shadow .18s, transform .18s, border-color .18s;
}
.vehicle-card:hover {
  box-shadow: var(--shadow-hover); transform: translateY(-2px); border-color: #b8c7de;
}
.card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--bg-soft); display: block; }
.card-img-placeholder {
  width: 100%; aspect-ratio: 4/3;
  background: linear-gradient(135deg, #e8edf5, #dce4f0);
  display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.8rem;
}
.card-body { padding: 0.75rem 0.85rem 0.9rem; display: flex; flex-direction: column; gap: 0.2rem; flex: 1; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.4rem; }
.card-top .model { font-weight: 700; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.02em; }
.card-top .price { font-weight: 700; font-size: 1.05rem; color: var(--primary); white-space: nowrap; }
.spec { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
.meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; gap: 0.35rem; }
.reg { font-weight: 700; letter-spacing: 0.5px; font-size: 0.85rem; margin-top: 0.25rem; }
.colour { font-size: 0.75rem; color: var(--muted); }
.flags { display: flex; flex-wrap: wrap; gap: 0.2rem; margin-top: 0.3rem; }
.flag { font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 3px; background: var(--bg-soft); color: var(--muted); font-weight: 600; }
.badge-service {
  display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 0.15rem 0.4rem;
  border-radius: 4px; margin-top: 0.25rem; letter-spacing: 0.02em;
}
.badge-fsh { background: #dcfce7; color: #166534; }
.badge-mfr { background: #dbeafe; color: #1e40af; }
.badge-part { background: #fef3c7; color: #92400e; }
.badge-none { background: #f3f4f6; color: #6b7280; }
.empty, .empty-state {
  text-align: center; padding: 3rem 1rem; color: var(--muted);
  background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
}

/* Modal */
.overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
  z-index: 100; display: flex; align-items: flex-start; justify-content: center;
  padding: 1.5rem 1rem; overflow-y: auto; backdrop-filter: blur(2px);
}
.overlay[hidden] { display: none !important; }
.modal {
  background: var(--card); border-radius: 12px; width: 100%; max-width: 920px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 1px solid var(--border);
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.9rem 1.15rem; border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: 1.1rem; }
.modal-body { padding: 1.15rem; }
.modal-close {
  background: none; border: none; font-size: 1.6rem; cursor: pointer; color: var(--muted);
  line-height: 1; width: 42px; height: 42px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--bg-soft); color: var(--text); }
.modal-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.detail-grid { display: grid; grid-template-columns: 1fr 260px; gap: 1.15rem; }
.photo-box { border-radius: 8px; overflow: hidden; background: var(--bg-soft); margin-bottom: 0.9rem; border: 1px solid var(--border); }
.photo-box img { width: 100%; display: block; aspect-ratio: 16/10; object-fit: cover; }
.photo-box .no-photo { height: 160px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.price-lg { font-size: 1.65rem; font-weight: 700; color: var(--primary); margin: 0.5rem 0; }
.info-box { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem; margin-bottom: 0.8rem; }
.info-box h3 { font-size: 0.8rem; margin-bottom: 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.info-box dl { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 0.7rem; font-size: 0.82rem; }
.info-box dt { color: var(--muted); }
.info-box dd { font-weight: 500; }
.notes-area { margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; }
.notes-area h3 { margin-bottom: 0.6rem; font-size: 0.95rem; }
.note-form { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; }
.note-form textarea {
  flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px;
  font-family: inherit; font-size: 0.85rem; resize: vertical; min-height: 56px;
}
.note-item {
  background: var(--bg-soft); border-left: 3px solid var(--primary);
  padding: 0.55rem 0.8rem; border-radius: 0 6px 6px 0; margin-bottom: 0.45rem;
}
.note-date { font-size: 0.7rem; color: var(--muted); }
.note-text { font-size: 0.85rem; white-space: pre-wrap; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.form-row { margin-bottom: 0.7rem; }
.form-row label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 0.2rem; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 0.42rem 0.6rem; border: 1px solid var(--border); border-radius: 5px;
  font-size: 0.88rem; font-family: inherit; background: #fff;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; }
fieldset { border: 1px solid var(--border); border-radius: 7px; padding: 0.7rem 0.9rem; margin: 0.9rem 0; }
legend { font-size: 0.82rem; font-weight: 600; padding: 0 0.25rem; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.25rem 0.7rem; }
.form-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
.form-actions .btn { min-width: 110px; }
.btn-edit, .btn-save {
  min-height: 42px; padding: 0.55rem 1.15rem; font-size: 0.9rem; font-weight: 600;
  border-radius: 8px; cursor: pointer; border: none; font-family: inherit;
}
.btn-edit { background: var(--primary-dim); color: var(--primary); }
.btn-save { background: var(--primary); color: #fff; }
.hide-xs { }

@media (min-width: 1100px) {
  .vehicle-grid { grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 1.1rem; }
  .container { padding: 1.5rem 2rem 3rem; }
}

@media (max-width: 720px) {
  body { -webkit-tap-highlight-color: transparent; }
  .detail-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }

  .top-nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; flex-wrap: nowrap; align-items: center;
    height: auto; min-height: 52px;
    padding: 0.5rem 0.75rem;
    padding-top: max(0.5rem, env(safe-area-inset-top));
    padding-left: max(0.75rem, env(safe-area-inset-left));
    padding-right: max(0.75rem, env(safe-area-inset-right));
    gap: 0.5rem;
  }
  .brand {
    flex: 1 1 auto; min-width: 0; max-width: none;
    min-height: 44px; padding: 0.25rem 0.2rem;
  }
  .brand-logo { width: 36px; height: 36px; flex-shrink: 0; }
  .brand-text { font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-right {
    flex: 0 0 auto; margin-left: auto;
    gap: 0.35rem;
  }
  .nav-right .btn-ghost, .nav-right button {
    min-height: 40px; min-width: 40px; padding: 0.4rem 0.65rem;
  }
  /* Desktop-style tabs hidden on phone — category uses select below */
  .nav-links { display: none !important; }
  .sync-status, .nav-right .sync-status { display: none; }
  #syncStatusMobile { display: block; font-size: 0.75rem; color: var(--muted); margin: 0 0 0.5rem; }

  .container {
    padding: 0.75rem 0.7rem 2.5rem;
    padding-bottom: max(2.5rem, env(safe-area-inset-bottom));
    padding-left: max(0.7rem, env(safe-area-inset-left));
    padding-right: max(0.7rem, env(safe-area-inset-right));
  }
  .page-header { flex-direction: column; align-items: stretch; gap: 0.65rem; margin-bottom: 0.75rem; }
  .page-header h1 { font-size: 1.15rem; }
  .search-box { max-width: none; width: 100%; flex-wrap: nowrap; gap: 0.35rem; }
  .search-box input {
    flex: 1 1 auto; min-width: 0; min-height: 44px; font-size: 16px;
    border-radius: 10px;
  }

  .filters-bar {
    padding: 0.65rem 0.75rem; gap: 0.5rem 0.65rem; margin-bottom: 0.85rem;
  }
  .filters-bar .filter-row { width: 100%; gap: 0.5rem; }
  .filters-bar label { flex: 1 1 45%; min-width: 0; }
  .filters-bar select, .filters-bar input {
    width: 100%; min-width: 0; min-height: 42px; font-size: 16px; border-radius: 8px;
  }
  .filter-toggle { flex: 0 0 auto; }
  .btn-toggle-images { min-height: 42px; min-width: 52px; }

  .vehicle-grid { grid-template-columns: 1fr; gap: 0.7rem; }
  .make-title { font-size: 0.92rem; margin-top: 0.85rem; position: sticky; top: 52px; z-index: 5;
    background: var(--bg); padding: 0.35rem 0; }
  .model-title { font-size: 0.88rem; }

  /* Card: image + body side by side for denser list */
  .vehicle-card {
    flex-direction: row; align-items: stretch; min-height: 0;
  }
  .vehicle-card.no-img { flex-direction: column; }
  .vehicle-card .card-img,
  .vehicle-card .card-img-placeholder {
    width: 38%; max-width: 140px; flex-shrink: 0;
    aspect-ratio: 1; align-self: stretch; height: auto; min-height: 110px;
    object-fit: cover;
  }
  .vehicle-card .card-body {
    padding: 0.55rem 0.65rem; flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 0.15rem;
  }
  .vehicle-card .card-top { gap: 0.35rem; }
  .vehicle-card .model { font-size: 0.92rem; line-height: 1.25; }
  .vehicle-card .price { font-size: 0.95rem; white-space: nowrap; }
  .vehicle-card .spec { font-size: 0.75rem; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vehicle-card .meta { font-size: 0.72rem; flex-wrap: wrap; gap: 0.2rem 0.5rem; }
  .vehicle-card .reg { font-size: 0.78rem; letter-spacing: 0.03em; }
  .vehicle-card .colour { font-size: 0.72rem; }
  .vehicle-card .feature-chips { margin-top: 0.2rem; }
  .vehicle-card .feat { font-size: 0.6rem; padding: 0.12rem 0.32rem; }

  /* Full-screen modal */
  .overlay {
    padding: 0; align-items: stretch; justify-content: stretch;
  }
  .modal {
    max-width: 100%; width: 100%; border-radius: 0; min-height: 100%;
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  .modal-header {
    position: sticky; top: 0; z-index: 2; background: var(--card);
    padding: 0.75rem 0.85rem;
    padding-top: max(0.75rem, env(safe-area-inset-top));
  }
  .modal-header h2 { font-size: 1rem; line-height: 1.3; padding-right: 0.5rem; }
  .modal-header .btn, .modal-header button { min-height: 44px; min-width: 44px; }
  .modal-body, #detailBody {
    padding: 0.85rem !important;
    padding-bottom: max(1.5rem, env(safe-area-inset-bottom)) !important;
  }
  .photo-box img { max-height: 220px; width: 100%; object-fit: cover; border-radius: 8px; }
  .price-lg { font-size: 1.35rem; }
  .btn, button.btn-primary, button.btn-secondary {
    min-height: 44px; touch-action: manipulation;
  }
  .note-form textarea { font-size: 16px; min-height: 88px; }
  .list-view-toolbar { flex-direction: column; align-items: stretch; }
  .list-view-toolbar .btn { width: 100%; }
  .stock-list-table { font-size: 0.8rem; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .list-reg { width: auto; }
  .list-name { max-width: 42vw; }
}

@media (max-width: 420px) {
  .hide-xs { display: none !important; }
  .vehicle-card .card-img,
  .vehicle-card .card-img-placeholder { width: 34%; max-width: 120px; min-height: 100px; }
  .nav-links button { padding: 0.45rem 0.35rem; font-size: 0.74rem; flex: 1 1 calc(50% - 0.35rem); max-width: none; }
}
@media print {
  .top-nav, .no-print, .overlay, .filters-bar, .search-box { display: none !important; }
  body { background: #fff; }
}


.filter-toggle {
  display: flex; flex-direction: column; gap: 0.25rem;
  font-size: 0.72rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.03em;
}
.btn-toggle-images {
  padding: 0.45rem 0.85rem; border: 1px solid var(--border); border-radius: 7px;
  font-size: 0.88rem; font-weight: 600; font-family: inherit;
  background: #fff; color: var(--text); cursor: pointer;
  min-width: 72px; min-height: 38px;
  transition: background .12s, border-color .12s, color .12s;
}
.btn-toggle-images:hover {
  border-color: var(--primary); color: var(--primary); background: var(--primary-dim);
}
.btn-toggle-images:not(.off) {
  background: var(--primary); color: #fff; border-color: var(--primary);
}
.btn-toggle-images:not(.off):hover {
  background: var(--primary-h); border-color: var(--primary-h); color: #fff;
}
.btn-toggle-images.off {
  background: #fff; color: var(--muted); border-color: var(--border);
}
.vehicle-card.no-img .card-body { padding-top: 0.85rem; }
body.hide-images .vehicle-grid {
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}

.list-view-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.list-view-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem;
  padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border);
  font-size: 0.85rem; color: var(--muted); font-weight: 600;
}
.stock-list-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.stock-list-table th {
  text-align: left; padding: 0.5rem 0.75rem; font-size: 0.72rem; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--muted); border-bottom: 2px solid var(--border); background: var(--bg-soft);
}
.stock-list-table td { padding: 0.45rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.stock-list-table tr.list-row { cursor: pointer; }
.stock-list-table tr.list-row:hover { background: var(--primary-dim); }
.list-brand td {
  background: var(--bg-soft); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--primary); padding-top: 0.65rem; border-bottom: 1px solid #b8c7de;
}
.list-reg { font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; width: 7.5rem; }
.list-name { color: var(--text); }
.list-year { width: 4rem; color: var(--muted); }
.list-miles { width: 5.5rem; text-align: right; white-space: nowrap; color: var(--muted); }
.list-price { width: 6rem; text-align: right; font-weight: 700; color: var(--primary); white-space: nowrap; }
body.list-view-mode .filters-bar .filter-toggle:first-child { /* photos still ok */ }
@media print {
  .top-nav, .filters-bar, .search-box, .page-header .search-box, .list-view-toolbar, .no-print { display: none !important; }
  .list-view-wrap { border: none; box-shadow: none; }
  .stock-list-table { font-size: 11px; }
  .list-row { break-inside: avoid; }
  .list-brand { break-after: avoid; }
}

.feature-chips { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.35rem; }
.feat {
  font-size: 0.65rem; font-weight: 600; padding: 0.15rem 0.4rem; border-radius: 4px;
  background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; line-height: 1.2;
}
.feat.more { background: var(--bg-soft); color: var(--muted); border-color: var(--border); }

.flag-reserved { background: #fef3c7 !important; color: #92400e !important; border: 1px solid #fcd34d; font-weight: 700; }

/* Mobile category chips — premium strip */
.mobile-cat-bar {
  display: none;
  position: sticky;
  top: 52px;
  z-index: 40;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(15, 23, 42, 0.06);
  padding: 0.55rem 0;
  box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
}
.mobile-cat-scroll {
  display: flex;
  flex-wrap: nowrap;
  gap: 0.45rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
  scroll-padding-inline: 0.85rem;
  padding: 0.1rem 0.85rem;
  padding-left: max(0.85rem, env(safe-area-inset-left));
  padding-right: max(1.75rem, env(safe-area-inset-right));
  scrollbar-width: none;
  mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 32px), transparent 100%);
  -webkit-mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 32px), transparent 100%);
}
.mobile-cat-scroll::-webkit-scrollbar { display: none; }
.cat-chip {
  flex: 0 0 auto;
  scroll-snap-align: start;
  appearance: none;
  border: 1px solid rgba(15, 23, 42, 0.08);
  background: #fff;
  color: #475569;
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  padding: 0.55rem 1.05rem;
  min-height: 40px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  transition: background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .12s ease;
  -webkit-tap-highlight-color: transparent;
}
.cat-chip:active { transform: scale(0.97); }
.cat-chip.active {
  background: linear-gradient(135deg, #1e3a5f 0%, #2a4a73 100%);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(30, 58, 95, 0.3);
}
@media (min-width: 721px) {
  .mobile-cat-bar { display: none !important; }
}
@media (max-width: 720px) {
  .mobile-cat-bar { display: block !important; }
}

/* —— Vehicle detail (hybrid: mobile sheet / desktop 2-col) —— */
.vd { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem 1.75rem; align-items: start; }
.vd-left { min-width: 0; }
.vd-right { min-width: 0; }
.vd-photo {
  border-radius: 12px; overflow: hidden; background: var(--bg-soft);
  border: 1px solid var(--border); margin-bottom: 1rem;
}
.vd-photo img { width: 100%; display: block; aspect-ratio: 16/10; object-fit: cover; }
.vd-photo-empty {

  color: var(--muted); font-size: 0.9rem;

.vd-price-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; margin-bottom: 0.35rem; }

}

.vd-offer { color: var(--accent); font-weight: 600; font-size: 0.9rem; margin-bottom: 0.75rem; }
.vd-metrics {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 0.85rem 0 1rem;
}
.vd-metric {
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px;
  padding: 0.65rem 0.75rem;
}
.vd-metric-label {
  display: block; font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--muted); margin-bottom: 0.2rem;
}
.vd-metric-value { font-size: 0.95rem; font-weight: 700; color: var(--text); }
.vd-reg-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
.vd-reg {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight: 700; font-size: 0.95rem; letter-spacing: 0.06em;
  background: #0f172a; color: #fff; padding: 0.35rem 0.65rem; border-radius: 6px;
}
.vd-colour { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
.vd-section { margin-bottom: 1.15rem; }
.vd-section-title {
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--muted); margin: 0 0 0.5rem;
}
.vd-spec { font-size: 0.9rem; line-height: 1.45; color: var(--text); margin: 0; }
.vd-dl {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem 1rem; margin: 0;
}
.vd-dl div { display: flex; flex-direction: column; gap: 0.1rem; }
.vd-dl dt { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
.vd-dl dd { margin: 0; font-size: 0.9rem; font-weight: 600; }
.vd-service {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem;
}
.vd-service-fsh { background: #ecfdf5; border-color: #a7f3d0; }
.vd-service-badge {
  flex-shrink: 0; font-weight: 800; font-size: 0.75rem; letter-spacing: 0.04em;
  background: #047857; color: #fff; padding: 0.35rem 0.5rem; border-radius: 6px;
}
.vd-service-fsh .vd-service-badge { background: #047857; }
.vd-service-notes { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }
.vd-notes { background: #fff; border-radius: 12px; padding: 0.85rem; border: 1px solid var(--border); }
.vd-note {
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.65rem 0.75rem; margin-bottom: 0.5rem;
}
.vd-note-meta { font-size: 0.72rem; color: var(--muted); font-weight: 600; margin-bottom: 0.25rem; }
.vd-note-text { font-size: 0.88rem; line-height: 1.4; }
.vd-note-form { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.65rem; }
.vd-note-form textarea {
  width: 100%; min-height: 72px; padding: 0.65rem 0.75rem; border-radius: 8px;
  border: 1px solid var(--border); font-family: inherit; font-size: 0.9rem; resize: vertical;
}
.vd-note-form textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }

.vd-link { color: var(--primary); font-weight: 600; font-size: 0.9rem; text-decoration: none; }

.vd-actions-desktop { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }

@media (max-width: 720px) {
  .vd { grid-template-columns: 1fr; gap: 0.85rem; padding-bottom: 4.5rem; }
  .vd-photo img, .vd-photo-empty { aspect-ratio: 16/11; }
  .vd-price { font-size: 1.55rem; }
  .vd-metrics { grid-template-columns: 1fr 1fr; gap: 0.4rem; }
  .vd-dl { grid-template-columns: 1fr 1fr; }
  .vd-actions-desktop { display: none; }
  .vd-actions-mobile {
    display: flex; gap: 0.5rem;
    position: sticky; bottom: 0; z-index: 5;
    margin: 0 -0.85rem -0.85rem; padding: 0.75rem 0.85rem;
    padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.94); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px rgba(15,23,42,0.06);
  }
  .vd-actions-mobile .btn { flex: 1; min-height: 46px; font-weight: 600; }
  .vd-notes { background: #fff !important; }
  .vd-note { background: #f1f5f9 !important; }
  .vd-note-form textarea { background: #fff !important; }
  .modal-header .btn-secondary,
  .modal-header .btn-primary.btn-lg { display: none; }
}

.feat-more-btn {
  display: inline-flex; align-items: center; margin-top: 0.45rem;
  appearance: none; border: none; background: none; padding: 0.25rem 0;
  font-family: inherit; font-size: 0.8rem; font-weight: 700;
  color: var(--primary); cursor: pointer; text-decoration: underline;
  text-underline-offset: 3px; -webkit-tap-highlight-color: transparent;
}
.feat-more-btn:hover { color: #152a45; }
.feat-panel {
  margin-top: 0.55rem; padding: 0.65rem 0.75rem;
  background: #fff; border: 1px solid var(--border); border-radius: 10px;
}
.feat-panel[hidden] { display: none !important; }
.feature-chips-all { margin-top: 0; }
.feature-chips-all .feat { font-size: 0.72rem; padding: 0.25rem 0.5rem; }

.vd-peg-dd { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
.vd-peg-input {
  flex: 1; min-width: 100px; max-width: 160px;
  padding: 0.4rem 0.55rem; border: 1px solid var(--border); border-radius: 7px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.9rem; font-weight: 600; letter-spacing: 0.03em;
  background: #fff;
}
.vd-peg-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
.btn-peg-save { min-height: 36px; padding: 0.35rem 0.75rem; font-size: 0.8rem; }

.card-colour-peg {
  display: flex; justify-content: space-between; align-items: center;
  gap: 0.5rem; margin-top: 0.15rem;
}
.card-colour-peg .colour { font-size: 0.78rem; color: var(--muted); }
.card-peg {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
  color: var(--primary); background: #e8eef6; border: 1px solid #c5d4e8;
  padding: 0.12rem 0.4rem; border-radius: 5px; white-space: nowrap;
}

.dash-strip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.65rem;
  margin-bottom: 1rem;
}
.dash-item {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 0.75rem 0.85rem; text-align: center;
  box-shadow: var(--shadow);
}
.dash-n { display: block; font-size: 1.45rem; font-weight: 800; color: var(--primary); line-height: 1.1; }
.dash-l { display: block; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 0.2rem; }
.dash-reserved .dash-n { color: #b45309; }
.dash-age .dash-n { color: #b91c1c; }
@media (max-width: 640px) {
  .dash-strip { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
  .dash-n { font-size: 1.25rem; }
}
.card-days {
  font-size: 0.7rem; font-weight: 700; color: var(--muted);
  background: var(--bg-soft); border: 1px solid var(--border);
  padding: 0.12rem 0.4rem; border-radius: 4px;
}
.card-days.hot { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
.card-price-was {
  font-size: 0.72rem; color: var(--muted); text-decoration: line-through; font-weight: 500;
  margin-right: 0.35rem;
}
.card-price-row { display: flex; align-items: baseline; gap: 0.25rem; flex-wrap: wrap; justify-content: flex-end; }
.card-reserved-by {
  font-size: 0.72rem; font-weight: 600; color: #92400e;
  background: #fef3c7; border: 1px solid #fcd34d;
  padding: 0.2rem 0.45rem; border-radius: 6px; margin-top: 0.35rem;
}
.card-prep {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
  padding: 0.15rem 0.4rem; border-radius: 4px; margin-top: 0.3rem; display: inline-block;
  background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe;
}
.card-prep.prep-Ready { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.card-prep.prep-Prep { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
.card-prep.prep-Photos { background: #f0f9ff; color: #0369a1; border-color: #bae6fd; }
.card-prep.prep-Display { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.card-sold-by { font-size: 0.72rem; color: var(--muted); margin-top: 0.25rem; }
.vd-ops { display: grid; gap: 0.75rem; }
.vd-ops-row { display: flex; flex-direction: column; gap: 0.3rem; }
.vd-ops-row label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.vd-ops-row input, .vd-ops-row select {
  padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: 7px;
  font-size: 0.9rem; font-family: inherit; background: #fff;
}
.vd-ops-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.price-move { font-size: 0.85rem; margin-top: 0.15rem; }
.price-move .was { text-decoration: line-through; color: var(--muted); margin-right: 0.35rem; }
.price-move .drop { color: #b91c1c; font-weight: 700; }

.vd-ops-actions .btn { flex: 1; min-width: 7rem; }
#detailStatus { font-weight: 700; }


.feat-wrap { margin-top: 0.35rem; }
.feat-wrap .feat-more-btn {
  display: inline-flex; align-items: center; gap: 0.25rem;
  margin-top: 0.4rem; padding: 0.35rem 0.65rem;
  border: 1px solid var(--border); border-radius: 999px;
  background: #f8fafc; color: var(--primary); font-weight: 700;
  font-size: 0.72rem; font-family: inherit; cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.feat-wrap .feat-more-btn:hover { background: #e8eef6; border-color: #c5d4e8; }
.feat-wrap.is-open .feat-more-btn { background: #e8eef6; }
.feat-wrap .feat-rest[hidden] { display: none !important; }
.feat-wrap.is-open .feat-rest { display: flex !important; }
.vd-features-section .feature-chips-all {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
}
.vd-features-section .feat {
  font-size: 0.78rem; padding: 0.35rem 0.6rem;
  background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0;
  border-radius: 8px; font-weight: 600;
}
.vd-feat-count {
  font-size: 0.75rem; font-weight: 700; color: var(--muted);
  background: var(--bg-soft); border-radius: 999px; padding: 0.1rem 0.45rem;
  margin-left: 0.35rem;
}
.vd-spec {
  font-size: 0.95rem; line-height: 1.45; color: var(--text);
  background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
  padding: 0.75rem 0.9rem; margin: 0;
}
.vehicle-card .feat-wrap { position: relative; z-index: 2; }

<script>

const FLAGS = ['Pre-Reg','Awaiting Prep','Bodyshop','Workshop','Lower Price','Special Offer','On Loan','Other','Auction','Deposit Taken'];

const IMPORT_VERSION = 'pentagon-burton-live';
let currentCat = 'Stock';
let currentId = null;



function catBadge(v) {
  const c = v.category || 'Stock';
  if (c === 'Stock') return '';
  return `<span class="badge-service badge-none">${c}</span>`;
}

function serviceBadge(v) {
  const s = (v.service_history || '').trim();
  if (!s) return '';
  let cls = 'badge-none', label = s;
  const low = s.toLowerCase();
  if (low.includes('full service') || low === 'fsh') { cls = 'badge-fsh'; label = 'FSH'; }
  else if (low.includes('manufacturer')) { cls = 'badge-mfr'; label = 'Full manufacturer'; }
  else if (low.includes('part')) { cls = 'badge-part'; label = 'Part service'; }
  else if (low.includes('no history')) { cls = 'badge-none'; label = 'No history'; }
  return `<span class="badge-service ${cls}">${label}</span>`;
}

let _debounceTimer;
function debounceRender() {
  clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(renderList, 300);
}

function clearFilters() {
  document.getElementById('filterFuel').value = '';
  document.getElementById('filterMinPrice').value = '';

}

function setLastSynced(isoOrText) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (!isoOrText) return;
  let text = isoOrText;
  if (/^\d{4}-/.test(String(isoOrText)) || isoOrText instanceof Date) {
    const d = new Date(isoOrText);
    text = 'Synced ' + d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' });
  }
  el.textContent = text;
  el.className = 'sync-status ok';
}





/* ===== Reliable scheduled stock sync ===== */
const SYNC_KEY = 'dsb_last_sync_ok';
const SYNC_MIN_GAP_MS = 3 * 60 * 60 * 1000; // don't auto more than every 3h
const SYNC_BUSINESS_POLL_MS = 30 * 60 * 1000; // while tab open in business hours

function ukHourNow() {
  try {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: 'numeric', hour12: false }).formatToParts(new Date());
    return parseInt(parts.find(p => p.type === 'hour').value, 10);
  } catch (_) {
    return new Date().getHours();
  }
}

function isUkBusinessHours() {
  const h = ukHourNow();
  return h >= 8 && h < 19;
}

function lastSyncOk() {
  const t = parseInt(localStorage.getItem(SYNC_KEY) || '0', 10);
  return t || 0;
}

function markSyncOk() {
  localStorage.setItem(SYNC_KEY, String(Date.now()));
}

async function syncStockNow(opts) {
  opts = opts || {};
  const silent = !!opts.silent;
  if (!location.protocol.startsWith('http')) {
    if (!silent) alert('Sync only works on the live site.');
    return false;
  }
  if (!silent) setSyncStatus('Syncing from Pentagon…', '');
  try {
    const res = await fetch('/api/sync-stock?t=' + Date.now(), { method: 'POST', cache: 'no-store' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    markSyncOk();
    const msg = (data.inStock || data.live || '?') + ' in stock · ' + (data.sold || 0) + ' sold · ' +
      new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    setSyncStatus(msg, 'ok');
    const mob = document.getElementById('syncStatusMobile');
    if (mob) mob.textContent = msg;
    if (!silent) {
      setTimeout(() => location.reload(), 2000);
    } else if (data.newlySold > 0 || data.returned > 0) {
      // Stock changed — soft reload vehicles
      setTimeout(() => location.reload(), 1500);
    }
    return true;
  } catch (e) {
    const err = 'Sync failed: ' + (e.message || e);
    setSyncStatus(err, 'err');
    const mob = document.getElementById('syncStatusMobile');
    if (mob) mob.textContent = err;
    return false;
  }
}

async function maybeAutoSync() {
  if (!location.protocol.startsWith('http')) return;
  if (!isUkBusinessHours()) return;
  if (Date.now() - lastSyncOk() < SYNC_MIN_GAP_MS) return;
  await syncStockNow({ silent: true });
}

function startReliableSync() {
  // After first load settles
  setTimeout(maybeAutoSync, 8000);
  setInterval(maybeAutoSync, SYNC_BUSINESS_POLL_MS);
}


function goHome() {
  setCategory('Stock');

}

function setSyncStatus(text, cls) {
  const el = document.getElementById('syncStatus');
  if (el) {
    el.textContent = text;
    el.className = 'sync-status' + (cls ? ' ' + cls : '');

}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }


function daysInStock(v) {
  const raw = v.bring_into_stock_date || v.date_in_stock || '';
  if (!raw) return null;
  const d = new Date(raw);
  if (isNaN(d.getTime())) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  return Math.max(0, Math.round((today - d) / 86400000));
}
function daysBadge(v) {
  const n = daysInStock(v);
  if (n == null) return '';
  const hot = n >= 60 ? ' hot' : '';
  return `<span class="card-days${hot}">${n}d</span>`;
}
function priceBlock(v) {
  const cur = v.retail_price;
  const prev = v.previous_price;
  let was = '';
  if (prev != null && cur != null && Number(prev) > Number(cur)) {
    was = `<span class="card-price-was">${fmtPrice(prev)}</span>`;
  }
  return `<div class="card-price-row">${was}<span class="price">${fmtPrice(cur)}</span></div>`;
}
function reservedByHtml(v) {
  const flags = v.status_flags || [];
  const isRes = flags.includes('Reserved') || v.is_reserved;
  if (!isRes && !(v.reserved_by || '').trim()) return '';
  const who = (v.reserved_by || '').trim();
  if (!who) return `<div class="card-reserved-by">Reserved</div>`;
  const when = v.reserved_at ? ` · ${v.reserved_at}` : '';
  return `<div class="card-reserved-by">On it: ${who.replace(/</g,'&lt;')}${when.replace(/</g,'&lt;')}</div>`;
}
function prepBadge(v) {
  const p = (v.prep_status || '').trim();
  if (!p) return '';
  return `<span class="card-prep prep-${p.replace(/[^a-zA-Z]/g,'')}">${p}</span>`;
}
function soldByHtml(v) {
  if ((v.category || '') !== 'Sold' && (v.category || '') !== 'Delivered') return '';
  const who = (v.sold_by || '').trim();
  if (!who) return '';
  return `<div class="card-sold-by">Sold by ${who.replace(/</g,'&lt;')}</div>`;
}


function save() {
  localStorage.setItem('dealerStock', JSON.stringify(vehicles));
}


function cleanModelDisplay(make, model) {
  let m = (model || '').trim();
  const mk = (make || '').trim();
  if (mk && m.toLowerCase().startsWith(mk.toLowerCase() + ' ')) m = m.slice(mk.length).trim();
  const parts = m.split(/\s+/);
  const out = [];
  parts.forEach(p => { if (!out.length || out[out.length-1].toLowerCase() !== p.toLowerCase()) out.push(p); });
  return out.join(' ');
}

function formatSpec(d) {
  if (!d) return '';
  let s = String(d).trim();
  // Data is scraped from the live listing title (already correct: 1.2, 82.5 kWh).
  // Only tidy casing / acronyms — never invent or move decimal points.
  const map = [
    [/\bPuretech\b/gi, 'PureTech'], [/\bTfsi\b/g, 'TFSI'], [/\bTsi\b/g, 'TSI'],
    [/\bTdi\b/g, 'TDI'], [/\bHdi\b/gi, 'HDi'], [/\bBluehdi\b/gi, 'BlueHDi'],
    [/\bEcoboost\b/gi, 'EcoBoost'], [/\bCrdi\b/gi, 'CRDi'], [/\bTce\b/gi, 'TCe'],
    [/\bMhev\b/gi, 'MHEV'], [/\bDm I\b/gi, 'DM-i'], [/\bEat6\b/gi, 'EAT6'],
    [/\bEat8\b/gi, 'EAT8'], [/\bCvt\b/g, 'CVT'], [/\bAwd\b/g, 'AWD'],
    [/\bkwh\b/gi, 'kWh'], [/(\d)\s*kWh/gi, '$1 kWh'], [/\bPs\b/g, 'PS'], [/\bBhp\b/g, 'BHP'],
  ];
  map.forEach(([pat, rep]) => { s = s.replace(pat, rep); });
  return s.replace(/\s+/g, ' ').trim();
}


function fmtPrice(p) {
  if (p == null || p === '') return '—';
  return '£' + Number(p).toLocaleString('en-GB', { maximumFractionDigits: 0 });
}

function naturalModelKey(model) {
  const m = model || '';
  const nums = m.match(/\d+/);
  if (nums) return [0, parseInt(nums[0], 10), m.toLowerCase()];
  return [1, 0, m.toLowerCase()];
}

function groupVehicles(list) {
  const byMake = {};
  list.forEach(v => {
    const make = (v.make || 'Unknown').toUpperCase();
    if (!byMake[make]) byMake[make] = {};
    const model = (v.model || 'Unknown').toUpperCase();
    if (!byMake[make][model]) byMake[make][model] = [];
    byMake[make][model].push(v);
  });
  Object.keys(byMake).forEach(make => {
    Object.keys(byMake[make]).forEach(model => {
      byMake[make][model].sort((a, b) => (a.retail_price || 1e12) - (b.retail_price || 1e12));
    });
  });
  return byMake;
}


let showImages = localStorage.getItem('dsb_show_images') !== '0';

}


function normalizeFeatureLabel(raw) {
  let f = String(raw || '').trim();
  if (!f) return '';
  const low = f.toLowerCase();

  // Ignore leather on controls / trim that is not seats
  if (/leather/i.test(f) && /steering\s*wheel|gear\s*(knob|lever|shift)|handbrake|gaiter|armrest|door\s*(centre|center)\s*trim|door\s*card/i.test(f) && !/seat/i.test(f)) {
    return '';
  }

  // Named full leathers (OEM)
  if (/nappa/i.test(f)) return 'Nappa Leather';
  if (/dakota/i.test(f)) return 'Dakota Leather';
  if (/vernasca/i.test(f)) return 'Vernasca Leather';
  if (/merino/i.test(f)) return 'Merino Leather';
  if (/alcantara/i.test(f) && /seat|upholstery|interior|trim/i.test(f)) return 'Alcantara';
  if (/alcantara/i.test(f) && !/steering|gear/i.test(f)) return 'Alcantara';

  // Part leather / mixed
  if (/part[\s-]*leather|partial\s*leather|half[\s-]*leather|leather\s*bolster|leather\s*inserts?|mixed\s*leather|tri-material.*leather|technoleather|fabric[\s-]*technoleather|leather\s*\/\s*cloth|cloth\s*\/\s*leather/i.test(f)) {
    return 'Part Leather';
  }
  if (/vegan\s*leather.*bolster|bolster.*vegan\s*leather/i.test(f)) return 'Part Leather';

  // Leatherette / faux
  if (/sensatec|leatherette|synthetic\s*leather|artificial\s*leather|faux\s*leather|leather\s*effect|pu\s*leather/i.test(f)) {
    return 'Leatherette';
  }
  if (/vegan\s*leather/i.test(f) && !/bolster/i.test(f)) return 'Leatherette';

  // Explicit full
  if (/full[\s-]*leather/i.test(f)) return 'Full Leather';
  if (/leather\s*upholstery|leather\s*interior/i.test(f) && !/part|partial|half|door|armrest/i.test(f)) return 'Full Leather';

  // "Leather - Colour" style (often seat pack on Hyundai/Kia etc.)
  if (/^leather\s*[-–—]/i.test(f) && !/steering|gear|handbrake/i.test(f)) return 'Full Leather';

  // Explicit seat leather
  if (/leather\s*seats?/i.test(f) && /full/i.test(f)) return 'Full Leather';
  if (/leather\s*seats?/i.test(f) && /part|partial/i.test(f)) return 'Part Leather';

  // Bare "Leather Seats" / "Leather" from bad mass-tagging — hide (not reliable)
  if (/^leather\s*seats?$/i.test(f) || /^leather$/i.test(f)) return '';

  if (/heated\s*(front\s*)?seats?/i.test(f)) return 'Heated Seats';
  if (/ventilated|cooled\s*seats?/i.test(f)) return 'Ventilated Seats';
  if (/massage\s*seats?/i.test(f)) return 'Massage Seats';
  if (/apple\s*carplay|carplay/i.test(f)) return 'Apple CarPlay';
  if (/android\s*auto/i.test(f)) return 'Android Auto';
  if (/wireless\s*charg/i.test(f)) return 'Wireless Charging';
  if (/panoramic|glass\s*roof/i.test(f)) return 'Panoramic Roof';
  if (/sun\s*roof|sunroof/i.test(f) && !/panoramic/i.test(f)) return 'Sunroof';
  return f;
}

function normalizeFeaturesList(list) {
  const seen = new Set();
  const out = [];
  // Prefer more specific leather labels if both appear
  const rank = { 'Nappa Leather': 0, 'Dakota Leather': 0, 'Vernasca Leather': 0, 'Merino Leather': 0, 'Full Leather': 1, 'Alcantara': 1, 'Part Leather': 2, 'Leatherette': 3, 'Leather': 4 };
  const leatherish = [];
  for (const raw of list || []) {
    const n = normalizeFeatureLabel(raw);
    if (!n) continue;
    if (rank[n] != null) { leatherish.push(n); continue; }
    const k = n.toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(n);
  }
  if (leatherish.length) {
    leatherish.sort((a, b) => (rank[a] ?? 9) - (rank[b] ?? 9));
    const best = leatherish[0];
    out.unshift(best);
  }
  return out;
}

function featureChips(v, limit) {
  const feats = normalizeFeaturesList(Array.isArray(v.key_features) ? v.key_features : []);
  if (!feats.length) return '';
  const lim = (limit == null || limit < 0) ? feats.length : Math.min(limit, feats.length);
  const showAll = limit == null || limit < 0 || limit >= feats.length;
  const head = showAll ? feats : feats.slice(0, lim);
  const chips = (list) => list.map(f =>
    `<span class="feat">${String(f).replace(/</g,'&lt;')}</span>`
  ).join('');

  if (showAll) {
    return `<div class="feature-chips feature-chips-all">${chips(feats)}</div>`;
  }

  const uid = 'fx_' + String(v.registration || v.id || Math.random()).replace(/[^a-zA-Z0-9]/g, '');
  // Collapsed: first N chips. Expanded: all chips. Toggle via class on wrapper.
  return `<div class="feat-wrap" id="${uid}" data-total="${feats.length}">
    <div class="feature-chips feat-head">${chips(head)}</div>
    <div class="feature-chips feature-chips-all feat-rest" hidden>${chips(feats)}</div>
    <button type="button" class="feat-more-btn" aria-expanded="false"
      onclick="event.preventDefault();event.stopPropagation();toggleFeatPanel('${uid}',this)">
      +${feats.length - lim} more features
    </button>
  </div>`;
}

function toggleFeatPanel(uid, btn) {
  const wrap = document.getElementById(uid);
  if (!wrap) return;
  const head = wrap.querySelector('.feat-head');
  const rest = wrap.querySelector('.feat-rest');
  const open = wrap.classList.toggle('is-open');
  if (rest) {
    if (open) rest.removeAttribute('hidden');
    else rest.setAttribute('hidden', '');
  }
  if (head) head.style.display = open ? 'none' : '';
  if (btn) {
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    const total = wrap.getAttribute('data-total') || '';
    btn.textContent = open ? 'Show less' : ('+' + Math.max(0, Number(total) - (head ? head.querySelectorAll('.feat').length : 0)) + ' more features');
  }
}


function cardHtml(v) {
  const flags = (v.status_flags || []).filter(f => f !== 'Reserved').map(f => `<span class="flag">${f}</span>`).join('');
  let img = '';
  if (showImages) {
    img = v.image_url
      ? `<img class="card-img" src="${v.image_url}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-img-placeholder',textContent:'No photo'}))">`
      : `<div class="card-img-placeholder">No photo</div>`;
  }
  const peg = (v.dealer_peg || '').trim();
  return `<div class="vehicle-card${showImages ? '' : ' no-img'}" onclick="openDetail('${(v.id || v.registration || '').replace(/'/g,"\\'")}')">
    ${img}
    <div class="card-body">
      <div class="card-top"><span class="model">${cleanModelDisplay(v.make, v.model)}</span>${priceBlock(v)}</div>
      <div class="spec">${formatSpec(v.derivative || '')}</div>
      <div class="meta"><span>${v.model_year || '—'} · ${(v.mileage||0).toLocaleString()} mi · ${daysBadge(v)}</span><span>${v.fuel || ''} ${v.transmission || ''}</span></div>
      <div class="reg">${v.registration || ''}</div>
      <div class="card-colour-peg">
        <span class="colour">${v.colour || ''}</span>
        ${peg ? `<span class="card-peg">PEG ${peg.replace(/</g,'&lt;')}</span>` : ''}
      </div>
      ${reservedByHtml(v)}
      ${prepBadge(v)}
      ${soldByHtml(v)}
      ${featureChips(v, 4)}
      ${catBadge(v)}${serviceBadge(v)}${flags ? `<div class="flags">${flags}</div>` : ''}
    </div>
  </div>`;
}



let listView = localStorage.getItem('dsb_list_view') === '1';

function updateListToggleBtn() {
  const btn = document.getElementById('toggleListBtn');
  if (!btn) return;
  btn.textContent = listView ? 'On' : 'Off';
  btn.classList.toggle('off', !listView);
  btn.setAttribute('aria-pressed', listView ? 'true' : 'false');
  document.body.classList.toggle('list-view-mode', listView);
}

function toggleListView() {
  listView = !listView;
  localStorage.setItem('dsb_list_view', listView ? '1' : '0');
  updateListToggleBtn();
  renderList();
}

function listTableHtml(list) {
  const fmt = n => (n == null || n === '') ? '—' : '£' + Number(n).toLocaleString('en-GB');
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  let rows = '';
  let lastMake = '';
  list.forEach(v => {
    const make = (v.make || '').toUpperCase();
    if (make !== lastMake) {
      rows += '<tr class="list-brand"><td colspan="5">' + esc(make) + '</td></tr>';
      lastMake = make;
    }
    const model = cleanModelDisplay(v.make, v.model);
    const name = esc([model, v.derivative].filter(Boolean).join(' · ').slice(0, 100));
    const id = esc(v.id || v.registration || '');
    rows += '<tr class="list-row" onclick="openDetail(\'' + id + '\')">'
      + '<td class="list-reg">' + esc(v.registration || '') + '</td>'
      + '<td class="list-name">' + name + '</td>'
      + '<td class="list-year">' + esc(v.model_year || '') + '</td>'
      + '<td class="list-miles">' + (v.mileage != null ? Number(v.mileage).toLocaleString('en-GB') : '—') + '</td>'
      + '<td class="list-price">' + fmt(v.retail_price) + '</td>'
      + '</tr>';
  });
  if (!list.length) return '<div class="empty">No vehicles found.</div>';
  return '<div class="list-view-wrap">'
    + '<div class="list-view-toolbar no-print">'
    + '<span>' + list.length + ' vehicles</span>'
    + '<button type="button" class="btn btn-secondary" onclick="window.print()">🖨 Print this list</button>'
    + '<button type="button" class="btn btn-secondary" onclick="toggleListView()">← Cards view</button>'
    + '</div>'
    + '<table class="stock-list-table">'
    + '<thead><tr><th>Reg</th><th>Vehicle</th><th>Year</th><th>Mileage</th><th>Price</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div>';
}

function renderList() {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const fuel = (document.getElementById('filterFuel') || {}).value || '';
  const minP = parseFloat((document.getElementById('filterMinPrice') || {}).value);
  const maxP = parseFloat((document.getElementById('filterMaxPrice') || {}).value);
  const sortBy = (document.getElementById('sortBy') || {}).value || 'default';
  const ON_SITE = ['Stock','Demonstrators','Pre-reg','Commercials','Arriving Soon','New'];
  let list = vehicles.filter(v => {
    if (currentCat === 'All') return true;
    if (currentCat === 'Stock') return ON_SITE.includes(v.category || 'Stock');
    return v.category === currentCat;
  });
  if (q) {
    list = list.filter(v =>
      (v.registration||'').toLowerCase().includes(q) ||
      (v.make||'').toLowerCase().includes(q) ||
      (v.model||'').toLowerCase().includes(q) ||
      (v.derivative||'').toLowerCase().includes(q) ||
      (v.colour||'').toLowerCase().includes(q)
    );
  }
  if (fuel) {
    list = list.filter(v => (v.fuel || '').toLowerCase().includes(fuel.toLowerCase()));
  }
  if (!isNaN(minP)) list = list.filter(v => v.retail_price != null && v.retail_price >= minP);
  if (!isNaN(maxP)) list = list.filter(v => v.retail_price != null && v.retail_price <= maxP);
  if (sortBy === 'price-asc') list = list.slice().sort((a,b) => (a.retail_price||1e12) - (b.retail_price||1e12));
  else if (sortBy === 'price-desc') list = list.slice().sort((a,b) => (b.retail_price||0) - (a.retail_price||0));
  else if (sortBy === 'mileage-asc') list = list.slice().sort((a,b) => (a.mileage||1e12) - (b.mileage||1e12));
  else if (sortBy === 'mileage-desc') list = list.slice().sort((a,b) => (b.mileage||0) - (a.mileage||0));
  else if (sortBy === 'year-desc') list = list.slice().sort((a,b) => (b.model_year||0) - (a.model_year||0));
  else if (sortBy === 'year-asc') list = list.slice().sort((a,b) => (a.model_year||0) - (b.model_year||0));

  document.getElementById('countLabel').textContent = '(' + list.length + ')';
  const hasFilter = !!(document.getElementById('searchInput').value || '').trim()
    || !!(document.getElementById('filterFuel') || {}).value
    || !!(document.getElementById('filterMinPrice') || {}).value
    || !!(document.getElementById('filterMaxPrice') || {}).value
    || ((document.getElementById('sortBy') || {}).value || 'default') !== 'default'
    || currentCat !== 'Stock';
  const clr = document.getElementById('clearSearchBtn');
  if (clr) clr.style.display = hasFilter ? 'inline-flex' : 'none';

  document.getElementById('pageTitle').childNodes[0].textContent = currentCat + ' ';
  const area = document.getElementById('listArea');
  if (!list.length) {
    area.innerHTML = '<div class="empty">No vehicles found.</div>';
    try { updateDashStrip(); } catch (_) {}
    return;
  }
  if (listView) {
    area.innerHTML = listTableHtml(list);
    try { updateDashStrip(); } catch (_) {}
    return;
  }
  if (sortBy !== 'default') {
    area.innerHTML = `<div class="vehicle-grid">${list.map(cardHtml).join('')}</div>`;
    try { updateDashStrip(); } catch (_) {}
    return;
  }
  const grouped = groupVehicles(list);
  const makes = Object.keys(grouped).sort();
  let html = '';
  makes.forEach(make => {
    html += `<section class="make-section"><h2 class="make-title">${make}</h2>`;
    const models = Object.keys(grouped[make]).sort((a, b) => {
      const ka = naturalModelKey(a), kb = naturalModelKey(b);
      return ka[0]-kb[0] || ka[1]-kb[1] || ka[2].localeCompare(kb[2]);
    });
    models.forEach(model => {
      const cars = grouped[make][model];
      html += `<h3 class="model-title">${model} <span class="model-count">(${cars.length})</span></h3>`;
      html += `<div class="vehicle-grid">${cars.map(cardHtml).join('')}</div>`;
    });
    html += `</section>`;
  });
  area.innerHTML = html;
  try { updateDashStrip(); } catch (_) {}
}

function statusPills(v) {
  const pills = [];
  const cat = v.category || 'Stock';
  if (cat && cat !== 'Stock') pills.push(`<span class="status-pill pill-cat">${cat}</span>`);
  (v.status_flags || []).forEach(f => {
    const cls = f === 'Reserved' || f === 'Deposit Taken' ? 'pill-reserved' : (f === 'New' ? 'pill-new' : 'pill-flag');
    pills.push(`<span class="status-pill ${cls}">${f}</span>`);
  });
  return pills.length ? `<div class="status-pills">${pills.join('')}</div>` : '';
}

function closeModal() { document.getElementById('detailModal').style.display = 'none'; currentId = null; }

async function addNote() {
  const v = vehicles.find(x => x.id === currentId);
  if (!v) return;
  const text = (document.getElementById('newNoteText').value || '').trim();
  if (!text) return;
  if (!v.notes) v.notes = [];
  v.notes.unshift({ date: new Date().toLocaleString('en-GB', { timeZone: 'Europe/London' }), text });
  save();
  openDetail(currentId);
  const r = await sharedSave({ registration: v.registration, add_note: text });
  if (!r.ok) alert('Note saved on this device only — shared save needs setup: ' + (r.error || ''));
  else setSyncStatus('Note shared with team', 'ok');
}

function deleteCurrent() {
  if (!currentId || !confirm('Remove this vehicle from your list?')) return;
  vehicles = vehicles.filter(v => v.id !== currentId);
  save();
  closeModal();
  renderList();
}

function printStockCard() {
  const v = vehicles.find(x => x.id === currentId);
  if (!v) return;
  // Prefer official Pentagon "print vehicle" page (accurate stock card)
  let printUrl = '';
  if (v.detail_url) {
    printUrl = v.detail_url.replace(/\/?$/, '') + '/print';
  }
  if (printUrl) {
    window.open(printUrl, '_blank', 'noopener');
    return;
  }
  // Fallback: print only this vehicle's detail card
  const body = document.getElementById('detailBody');
  if (!body) { window.print(); return; }
  const w = window.open('', '_blank');
  if (!w) { window.print(); return; }
  w.document.write(`<!DOCTYPE html><html><head><title>Stock Card ${v.registration || ''}</title>
    <style>
      body{font-family:system-ui,sans-serif;padding:1.5rem;color:#111;max-width:800px;margin:0 auto}
      h1{font-size:1.3rem;margin:0 0 0.5rem}
      .price{font-size:1.6rem;font-weight:700;color:#1a56a8;margin:0.5rem 0}
      img{max-width:100%;border-radius:8px}
      dl{display:grid;grid-template-columns:1fr 1fr;gap:0.35rem 1rem;font-size:0.9rem}
      dt{color:#666} dd{font-weight:600;margin:0}
    </style></head><body>`);
  w.document.write(`<h1>${(v.make||'')} ${(v.model||'')} · ${v.registration||''}</h1>`);
  if (v.image_url) w.document.write(`<img src="${v.image_url}" alt="">`);
  w.document.write(`<div class="price">${fmtPrice(v.retail_price)}</div>`);
  w.document.write(`<p>${formatSpec(v.derivative||'')}</p>`);
  w.document.write(`<dl>
    <dt>Colour</dt><dd>${v.colour||'—'}</dd>
    <dt>Year</dt><dd>${v.model_year||'—'}</dd>
    <dt>Mileage</dt><dd>${v.mileage!=null?v.mileage.toLocaleString()+' mi':'—'}</dd>
    <dt>Fuel</dt><dd>${v.fuel||'—'}</dd>
    <dt>Transmission</dt><dd>${v.transmission||'—'}</dd>
    <dt>Service</dt><dd>${v.service_history||'—'}</dd>
  </dl>`);
  w.document.write('</body></html>');
  w.document.close();
  setTimeout(() => { w.print(); }, 400);
}


function editCurrent() {
  const v = vehicles.find(x => x.id === currentId);
  if (!v) return;
  closeModal();
  openForm(v);
}

function openForm(v) {
  document.getElementById('formTitle').textContent = v ? 'Edit Vehicle' : 'Add Vehicle';
  document.getElementById('f_id').value = v ? v.id : '';
  const fields = ['registration','make','model','derivative','mileage','model_year','doors','transmission','fuel','body_type','colour','image_url','retail_price','bring_into_stock_date','category','service_history','service_history_notes','special_offer'];
  fields.forEach(f => {
    const el = document.getElementById('f_' + f);
    if (!el) return;
    el.value = v && v[f] != null ? v[f] : (f === 'category' ? 'Stock' : '');
  });
  document.getElementById('f_new_note').value = '';
  const sf = document.getElementById('statusFlags');
  sf.innerHTML = FLAGS.map(f => {
    const checked = v && (v.status_flags||[]).includes(f) ? 'checked' : '';
    return `<label><input type="checkbox" value="${f}" ${checked}> ${f}</label>`;
  }).join('');
  document.getElementById('formModal').style.display = 'flex';
}

function closeForm() { document.getElementById('formModal').style.display = 'none'; }

function saveVehicle(e) {
  e.preventDefault();
  const id = document.getElementById('f_id').value || uid();
  const existing = vehicles.find(v => v.id === id);
  const flags = [...document.querySelectorAll('#statusFlags input:checked')].map(c => c.value);
  const data = {
    id,
    registration: document.getElementById('f_registration').value.trim().toUpperCase(),
    make: document.getElementById('f_make').value.trim(),
    model: document.getElementById('f_model').value.trim(),
    derivative: document.getElementById('f_derivative').value.trim(),
    mileage: Number(document.getElementById('f_mileage').value) || null,
    model_year: Number(document.getElementById('f_model_year').value) || null,
    doors: Number(document.getElementById('f_doors').value) || null,
    transmission: document.getElementById('f_transmission').value,
    fuel: document.getElementById('f_fuel').value,
    body_type: document.getElementById('f_body_type').value,
    colour: document.getElementById('f_colour').value.trim(),
    image_url: document.getElementById('f_image_url').value.trim(),
    retail_price: Number(document.getElementById('f_retail_price').value) || null,
    bring_into_stock_date: document.getElementById('f_bring_into_stock_date').value || new Date().toISOString().slice(0,10),
    category: document.getElementById('f_category').value,
    service_history: document.getElementById('f_service_history').value,
    service_history_notes: document.getElementById('f_service_history_notes').value.trim(),
    special_offer: document.getElementById('f_special_offer').value.trim(),
    status_flags: flags,
    notes: existing ? (existing.notes || []) : [],
    source: existing ? existing.source : 'manual',
  };
  const note = document.getElementById('f_new_note').value.trim();
  if (note) data.notes.unshift({ date: new Date().toLocaleString('en-GB'), text: note });
  if (existing) {
    Object.assign(existing, data);
  } else {
    vehicles.push(data);
  }
  save();
  closeForm();
  renderList();
  sharedSave({
    registration: data.registration,
    service_history: data.service_history,
    service_history_notes: data.service_history_notes,
    status_flags: data.status_flags,
    special_offer: data.special_offer,
    category: data.category,
    notes: data.notes,
  }).then(r => {
    if (r.ok) setSyncStatus('Changes shared with team', 'ok');
    else console.warn('Shared save', r.error);
  });
}

async function saveSalesDesk() {
  const v = vehicles.find(x => x.id === currentId || x.registration === currentId);
  if (!v) return;
  const status = (document.getElementById('detailStatus') || {}).value || 'available';
  const prep = (document.getElementById('detailPrep') || {}).value || '';
  const reservedBy = ((document.getElementById('detailReservedBy') || {}).value || '').trim();
  const soldBy = ((document.getElementById('detailSoldBy') || {}).value || '').trim();
  let category = (document.getElementById('detailCategory') || {}).value || (v.category || 'Stock');

  applyDeskStatus(v, status, { reservedBy, soldBy, category, prep });

  try { save(); } catch (_) {}
  const payload = {
    registration: v.registration,
    category: v.category,
    prep_status: v.prep_status || '',
    reserved_by: v.reserved_by || '',
    reserved_at: v.reserved_at || '',
    sold_by: v.sold_by || '',
    status_flags: v.status_flags || [],
  };
  if (v.sold_date) payload.sold_date = v.sold_date;
  const r = await sharedSave(payload);
  if (!r.ok) alert('Saved on this device only — shared save failed: ' + (r.error || ''));
  openDetail(currentId);
  renderList();
}

function onDetailStatusChange() {
  const status = (document.getElementById('detailStatus') || {}).value || 'available';
  const rowR = document.getElementById('rowReservedBy');
  const rowS = document.getElementById('rowSoldBy');
  if (rowR) rowR.style.display = status === 'reserved' ? '' : 'none';
  if (rowS) rowS.style.display = (status === 'sold' || status === 'delivered') ? '' : 'none';
  const cat = document.getElementById('detailCategory');
  if (cat) {
    if (status === 'sold') cat.value = 'Sold';
    else if (status === 'delivered') cat.value = 'Delivered';
    else if (['Sold','Delivered'].includes(cat.value)) cat.value = 'Stock';
  }
}

function applyDeskStatus(v, status, opts) {
  opts = opts || {};
  const reservedBy = opts.reservedBy != null ? opts.reservedBy : (v.reserved_by || '');
  const soldBy = opts.soldBy != null ? opts.soldBy : (v.sold_by || '');
  const prep = opts.prep != null ? opts.prep : (v.prep_status || '');
  let category = opts.category != null ? opts.category : (v.category || 'Stock');
  const today = new Date().toISOString().slice(0, 10);
  const todayGB = new Date().toLocaleDateString('en-GB', { timeZone: 'Europe/London' });

  v.prep_status = prep;

  if (status === 'reserved') {
    if (category === 'Sold' || category === 'Delivered') category = 'Stock';
    v.category = category;
    v.reserved_by = reservedBy;
    v.reserved_at = v.reserved_at || todayGB;
    v.status_flags = Array.from(new Set([...(v.status_flags || []).filter(f => f !== 'Reserved'), 'Reserved']));
    delete v.sold_date;
  } else if (status === 'sold') {
    v.category = 'Sold';
    v.sold_by = soldBy;
    v.sold_date = v.sold_date || today;
    v.reserved_by = '';
    v.reserved_at = '';
    v.status_flags = (v.status_flags || []).filter(f => f !== 'Reserved');
  } else if (status === 'delivered') {
    v.category = 'Delivered';
    v.sold_by = soldBy;
    v.sold_date = v.sold_date || today;
    v.reserved_by = '';
    v.reserved_at = '';
    v.status_flags = (v.status_flags || []).filter(f => f !== 'Reserved');
  } else {
    // available
    if (category === 'Sold' || category === 'Delivered') category = 'Stock';
    v.category = category;
    v.reserved_by = '';
    v.reserved_at = '';
    v.status_flags = (v.status_flags || []).filter(f => f !== 'Reserved');
    delete v.sold_date;
  }
}

async function setVehicleStatus(status) {
  const v = vehicles.find(x => x.id === currentId || x.registration === currentId);
  if (!v) return;
  const hid = document.getElementById('detailStatus');
  if (hid) hid.value = status;
  // Update pill UI immediately
  document.querySelectorAll('.status-pill').forEach(btn => {
    btn.classList.toggle('is-active', btn.classList.contains('status-' + status));
  });
  const rowR = document.getElementById('rowReservedBy');
  const rowS = document.getElementById('rowSoldBy');
  if (rowR) rowR.style.display = status === 'reserved' ? '' : 'none';
  if (rowS) rowS.style.display = (status === 'sold' || status === 'delivered') ? '' : 'none';
  const cat = document.getElementById('detailCategory');
  if (cat) {
    if (status === 'sold') cat.value = 'Sold';
    else if (status === 'delivered') cat.value = 'Delivered';
    else if (['Sold','Delivered'].includes(cat.value)) cat.value = 'Stock';

}

async function quickStatus(status) {

    reserved_by: v.reserved_by || '',
    reserved_at: v.reserved_at || '',
    sold_by: v.sold_by || '',
    status_flags: v.status_flags || [],
  };
  if (v.sold_date) payload.sold_date = v.sold_date;
  const r = await sharedSave(payload);
  if (!r.ok) alert('Saved on this device only — shared save failed: ' + (r.error || ''));
